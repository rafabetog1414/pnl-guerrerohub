function pool(){return BANK.filter(function(q){if(S.practica&&S.module&&q.m!==S.module)return false;if(S.diff!=='todas'&&q.d!==S.diff)return false;return true;});}
function startQuiz(){var p=pool();if(!p.length){alert('No hay preguntas con esos filtros. Prueba otra combinación.');return;}
  var n=Math.min(S.count,p.length),q;
  var seen=store('gh_pnl_seen')||[];
  var pend=p.filter(function(x){return seen.indexOf(x.q)<0;});
  if(pend.length<n){seen=[];pend=p.slice();} /* memoria tipo baraja: reinicia el ciclo al agotar el pool */
  if(!S.practica){ /* examen: estratifica por tipo para asegurar variedad */
    var by={};pend.forEach(function(x){(by[x.t]=by[x.t]||[]).push(x);});
    var picks=[];Object.keys(shuffleObj(by)).forEach(function(t){if(picks.length<n)picks.push(shuffle(by[t])[0]);});
    var rest=shuffle(pend.filter(function(x){return picks.indexOf(x)<0;}));
    while(picks.length<n&&rest.length)picks.push(rest.pop());
    q=shuffle(picks).slice(0,n);
  } else { q=shuffle(pend).slice(0,n); }
  q.forEach(function(x){seen.push(x.q);});if(seen.length>400)seen=seen.slice(-250);store('gh_pnl_seen',seen);
  S.queue=q;S.idx=0;S.answers=[];S.ans=S.queue.map(function(){return null;});S.start=Date.now();renderQuiz();}
function shuffleObj(o){var ks=shuffle(Object.keys(o)),r={};ks.forEach(function(k){r[k]=o[k];});return r;}

function renderQuiz(){
  var q=S.queue[S.idx];app.innerHTML='';
  var prog=el('<div></div>');
  prog.innerHTML='<div class="pbar"><i style="width:'+((S.idx+1)/S.queue.length*100)+'%"></i></div><div class="meta"><span>Pregunta '+(S.idx+1)+' de '+S.queue.length+'</span><span>'+(S.practica?'Práctica':'Examen')+'</span></div>';
  app.appendChild(prog);
  var c=el('<div class="card"></div>');
  var head='<div class="qhead"><span class="badge" style="background:'+MODULES[q.m].color+'">'+MODULES[q.m].short+'</span><span class="dbadge '+q.d+'">'+q.d+'</span>'+(q.caso?'<span class="badge caso"><i data-lucide="search-check"></i> Caso</span>':'')+'<span class="ttype">'+TYPE_LABEL[q.t]+'</span></div><div class="qtext">'+q.q+'</div>';
  if(q.img)head+='<img class="qimg" src="'+IMAGES[q.img]+'" alt="lámina">';
  c.innerHTML=head;
  var area=el('<div id="area"></div>');c.appendChild(area);
  var hint=el('<div id="hint" class="hint hide"></div>');
  var fb=el('<div id="fb"></div>');
  var nav=el('<div class="nav"></div>');
  var back=el('<button class="btn1 btn2 navback" id="back"><i data-lucide="arrow-left"></i> Atrás</button>');
  back.disabled=(S.idx===0);
  var submit=el('<button class="btn1" id="submit" disabled>Responder</button>');
  nav.appendChild(back);nav.appendChild(submit);
  var st={q:q,hint:hint,fb:fb,submit:submit,back:back};
  back.onclick=function(){goBack(st);};
  submit.onclick=function(){onSubmit(st);};
  if(q.t==='unica'||q.t==='vf'||q.t==='completar')buildChoice(area,q,st,false);
  else if(q.t==='multiple')buildChoice(area,q,st,true);
  else if(q.t==='clasificar')buildClasificar(area,q,st);
  else if(q.t==='asociar')buildAsociar(area,q,st);
  else if(q.t==='ordenar')buildOrdenar(area,q,st);
  c.appendChild(hint);c.appendChild(fb);c.appendChild(nav);
  app.appendChild(c);
  var saved=S.ans[S.idx];
  if(saved&&saved.input)restore(st,saved);
  updateHint(st);
  refreshRight(st,saved);
  done();
}
function updateHint(st){
  var q=st.q,h=st.hint;
  if(q.t==='clasificar'){var n=Object.keys(st.assign).length,t=q.items.length;h.classList.remove('hide');h.className='hint'+(n===t?' done':'');h.innerHTML='<i data-lucide="'+(n===t?'check-circle':'list-checks')+'"></i> Clasificados '+n+' de '+t;}
  else if(q.t==='asociar'){var n2=Object.keys(st.match).filter(function(k){return st.match[k];}).length,t2=q.pairs.length;h.classList.remove('hide');h.className='hint'+(n2===t2?' done':'');h.innerHTML='<i data-lucide="'+(n2===t2?'check-circle':'link')+'"></i> Emparejados '+n2+' de '+t2;}
  else if(q.t==='multiple'){h.classList.remove('hide');h.className='hint';h.innerHTML='<i data-lucide="check-square"></i> Selecciona una o más opciones';}
  else if(q.t==='ordenar'){h.classList.remove('hide');h.className='hint';h.innerHTML='<i data-lucide="move-vertical"></i> Ordena con las flechas y pulsa Responder';}
  else h.classList.add('hide');
  icons();
}
function buildChoice(area,q,st,multi){
  st.sel=multi?[]:null;st.multi=multi;
  q._order=q._order||shuffle(q.o.map(function(_,i){return i;}));
  q._order.forEach(function(oi){
    var o=el('<div class="opt '+(multi?'':'rad')+'"><div class="box"></div><div>'+q.o[oi]+'</div></div>');o.dataset.i=oi;
    o.onclick=function(){if(st.locked)return;
      if(multi){var p=st.sel.indexOf(oi);if(p>=0){st.sel.splice(p,1);o.classList.remove('sel');o.querySelector('.box').innerHTML='';}else{st.sel.push(oi);o.classList.add('sel');o.querySelector('.box').innerHTML='<i data-lucide="check"></i>';}}
      else{Array.prototype.forEach.call(area.children,function(x){x.classList.remove('sel');x.querySelector('.box').innerHTML='';});st.sel=oi;o.classList.add('sel');o.querySelector('.box').innerHTML='<i data-lucide="check"></i>';}
      st.submit.disabled=multi?st.sel.length===0:(st.sel===null);icons();};
    area.appendChild(o);
  });
}
function buildClasificar(area,q,st){st.assign={};q._iorder=q._iorder||shuffle(q.items.map(function(_,i){return i;}));
  q._iorder.forEach(function(ii){var it=q.items[ii];var row=el('<div class="citem"><div class="ct">'+it[0]+'</div><div class="catbtns"></div></div>');var bb=row.querySelector('.catbtns');
    q.cats.forEach(function(cat,ci){var b=el('<button class="catbtn">'+cat+'</button>');b.onclick=function(){if(st.locked)return;Array.prototype.forEach.call(bb.children,function(x){x.classList.remove('sel');});b.classList.add('sel');st.assign[ii]=ci;st.submit.disabled=Object.keys(st.assign).length<q.items.length;updateHint(st);};bb.appendChild(b);});
    row.dataset.ii=ii;area.appendChild(row);});
}
function buildAsociar(area,q,st){st.match={};var rights=shuffle(q.pairs.map(function(p){return p[1];}));var lefts=q._lorder||(q._lorder=shuffle(q.pairs.map(function(_,i){return i;})));
  lefts.forEach(function(li){var p=q.pairs[li];var row=el('<div class="mrow2"><div class="ml">'+p[0]+'</div><span class="arri"><i data-lucide="arrow-right"></i></span></div>');
    var sel=document.createElement('select');sel.innerHTML='<option value="">— elige —</option>'+rights.map(function(r){return '<option value="'+encodeURIComponent(r)+'">'+r+'</option>';}).join('');
    sel.onchange=function(){st.match[li]=decodeURIComponent(sel.value);st.submit.disabled=Object.keys(st.match).filter(function(k){return st.match[k];}).length<q.pairs.length;updateHint(st);};
    sel.dataset.li=li;row.appendChild(sel);area.appendChild(row);});
}
function buildOrdenar(area,q,st){st.order=shuffle(q.seq.map(function(_,i){return i;}));
  function redraw(){area.innerHTML='';st.order.forEach(function(si,pos){var row=el('<div class="oitem"><div class="on">'+(pos+1)+'</div><div class="otx">'+q.seq[si]+'</div><div class="arr"></div></div>');var arr=row.querySelector('.arr');
    var up=el('<button><i data-lucide="chevron-up"></i></button>');up.onclick=function(){if(st.locked||pos===0)return;var t=st.order[pos-1];st.order[pos-1]=st.order[pos];st.order[pos]=t;redraw();};
    var dn=el('<button><i data-lucide="chevron-down"></i></button>');dn.onclick=function(){if(st.locked||pos===st.order.length-1)return;var t=st.order[pos+1];st.order[pos+1]=st.order[pos];st.order[pos]=t;redraw();};
    arr.appendChild(up);arr.appendChild(dn);area.appendChild(row);});icons();}
  st.redraw=redraw;redraw();
}
function grade(st){var q=st.q;
  if(q.t==='unica'||q.t==='vf'||q.t==='completar')return st.sel===q.c;
  if(q.t==='multiple')return eq(st.sel,q.c);
  if(q.t==='clasificar')return q.items.every(function(it,i){return st.assign[i]===it[1];});
  if(q.t==='asociar')return q.pairs.every(function(p,i){return st.match[i]===p[1];});
  if(q.t==='ordenar')return st.order.every(function(si,pos){return si===pos;});
  return false;}
function complete(st){var q=st.q;
  if(q.t==='unica'||q.t==='vf'||q.t==='completar')return st.sel!==null&&st.sel!==undefined;
  if(q.t==='multiple')return !!(st.sel&&st.sel.length);
  if(q.t==='clasificar')return Object.keys(st.assign).length>=q.items.length;
  if(q.t==='asociar')return Object.keys(st.match).filter(function(k){return st.match[k];}).length>=q.pairs.length;
  if(q.t==='ordenar')return true;return false;}
function capture(st){var q=st.q;
  if(q.t==='multiple')return {sel:st.sel.slice()};
  if(q.t==='unica'||q.t==='vf'||q.t==='completar')return {sel:st.sel};
  if(q.t==='clasificar'){var a={};for(var k in st.assign)a[k]=st.assign[k];return {assign:a};}
  if(q.t==='asociar'){var m={};for(var j in st.match)m[j]=st.match[j];return {match:m};}
  if(q.t==='ordenar')return {order:st.order.slice()};return {};}
function restore(st,saved){var q=st.q,area=document.getElementById('area'),inp=saved.input;
  if(q.t==='unica'||q.t==='vf'||q.t==='completar'||q.t==='multiple'){st.sel=inp.sel;
    Array.prototype.forEach.call(area.children,function(x){var i=parseInt(x.dataset.i);var on=st.multi?(inp.sel.indexOf(i)>=0):(inp.sel===i);if(on){x.classList.add('sel');x.querySelector('.box').innerHTML='<i data-lucide="check"></i>';}});}
  else if(q.t==='clasificar'){st.assign=inp.assign||{};Array.prototype.forEach.call(area.children,function(row){var ii=parseInt(row.dataset.ii);if(st.assign[ii]!==undefined){var bs=row.querySelectorAll('.catbtn');if(bs[st.assign[ii]])bs[st.assign[ii]].classList.add('sel');}});}
  else if(q.t==='asociar'){st.match=inp.match||{};Array.prototype.forEach.call(area.querySelectorAll('select'),function(sel){var li=parseInt(sel.dataset.li);if(st.match[li])sel.value=encodeURIComponent(st.match[li]);});}
  else if(q.t==='ordenar'){if(inp.order&&st.redraw){st.order=inp.order.slice();st.redraw();}}
  if(saved.answered&&S.practica){st.locked=true;markCorrections(st);showFeedback(st,saved.ok);}
}
function refreshRight(st,saved){var last=(S.idx===S.queue.length-1);
  if(S.practica){
    if(saved&&saved.answered){st.locked=true;st.next=true;st.hint.classList.add('hide');st.submit.innerHTML=(last?'Ver resultados <i data-lucide="flag"></i>':'Siguiente <i data-lucide="arrow-right"></i>');st.submit.disabled=false;}
    else{st.submit.innerHTML='Responder';st.submit.disabled=!complete(st);}
  } else {st.submit.innerHTML=(last?'Finalizar <i data-lucide="flag"></i>':'Siguiente <i data-lucide="arrow-right"></i>');st.submit.disabled=!complete(st);}
  icons();}
function goBack(st){var cur=S.ans[S.idx];
  if(!(cur&&cur.answered)&&complete(st))S.ans[S.idx]={answered:!S.practica,ok:grade(st),input:capture(st)};
  if(S.idx>0){S.idx--;renderQuiz();}}
function onSubmit(st){var last=(S.idx===S.queue.length-1);
  if(S.practica){
    if(!st.locked){st.locked=true;var ok=grade(st);S.ans[S.idx]={answered:true,ok:ok,input:capture(st)};st.hint.classList.add('hide');markCorrections(st);showFeedback(st,ok);st.submit.innerHTML=(last?'Ver resultados <i data-lucide="flag"></i>':'Siguiente <i data-lucide="arrow-right"></i>');st.submit.disabled=false;st.next=true;icons();}
    else advance();
  } else {var ok2=grade(st);S.ans[S.idx]={answered:true,ok:ok2,input:capture(st)};if(last)finish();else advance();}
}
function advance(){if(S.idx<S.queue.length-1){S.idx++;renderQuiz();}else finish();}
function markCorrections(st){var q=st.q,area=document.getElementById('area');
  if(q.t==='unica'||q.t==='vf'||q.t==='completar'||q.t==='multiple'){Array.prototype.forEach.call(area.children,function(x){var i=parseInt(x.dataset.i);x.classList.add('dis');var isC=(q.t==='multiple')?q.c.indexOf(i)>=0:i===q.c;var isS=(q.t==='multiple')?st.sel.indexOf(i)>=0:st.sel===i;if(isC){x.classList.add('ok');x.querySelector('.box').innerHTML='<i data-lucide="check"></i>';}else if(isS){x.classList.add('bad');x.querySelector('.box').innerHTML='<i data-lucide="x"></i>';}});}
  else if(q.t==='clasificar'){Array.prototype.forEach.call(area.children,function(row){var ii=parseInt(row.dataset.ii);var correct=q.items[ii][1];Array.prototype.forEach.call(row.querySelectorAll('.catbtn'),function(b,ci){if(ci===correct)b.classList.add('ok');else if(st.assign[ii]===ci)b.classList.add('bad');});});}
  else if(q.t==='asociar'){Array.prototype.forEach.call(area.querySelectorAll('select'),function(sel){var li=parseInt(sel.dataset.li);sel.disabled=true;if(st.match[li]===q.pairs[li][1])sel.classList.add('ok');else sel.classList.add('bad');});}
  else if(q.t==='ordenar'){Array.prototype.forEach.call(area.children,function(row,pos){if(st.order[pos]===pos)row.classList.add('ok');else row.classList.add('bad');});}
  icons();
}
function showFeedback(st,ok){var q=st.q;var extra='';if(!ok&&(q.t==='asociar'||q.t==='ordenar'||q.t==='clasificar'))extra='<div class="expl" style="margin-top:3px">Mira arriba: en verde lo correcto, en rojo lo que fallaste.</div>';
  st.fb.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><span class="fi"><i data-lucide="'+(ok?'check-circle':'x-circle')+'"></i></span><div><b>'+(ok?'¡Correcto!':'Incorrecto')+'</b><div class="expl">'+q.e+'</div>'+extra+'</div></div>';icons();}

function finish(){S.answers=S.queue.map(function(q,i){return {q:q,ok:!!(S.ans[i]&&S.ans[i].ok)};});var pts=S.answers.filter(function(a){return a.ok;}).length;var pct=Math.round(pts/S.answers.length*100);
  if(!S.practica){var hist=store('gh_pnl_hist')||[];hist.unshift({date:new Date().toISOString(),pct:pct,total:S.answers.length,correct:pts,secs:Math.round((Date.now()-S.start)/1000)});store('gh_pnl_hist',hist.slice(0,50));}
  renderResults();}
function color(pct){return pct>=80?'#2E9E57':pct>=60?'#0045D5':'#D5334A';}
function msg(pct){return pct>=90?'Dominas el tema.':pct>=80?'Aprobado. Vas muy bien.':pct>=60?'Casi. Repasa lo que fallaste.':'A reforzar. Practícalo de nuevo.';}
function renderResults(){app.innerHTML='';var pts=S.answers.filter(function(a){return a.ok;}).length,total=S.answers.length,pct=Math.round(pts/total*100),secs=Math.round((Date.now()-S.start)/1000);
  var c=el('<div class="card"></div>');
  c.innerHTML='<div class="score"><div class="ring" style="background:'+(pct>=80?'var(--grad-band)':pct>=60?'var(--grad-premium)':'linear-gradient(135deg,#9B2333,#D5334A)')+'"><div class="pct">'+pct+'%</div><div class="lab">'+pts+' / '+total+'</div></div><h2>'+msg(pct)+'</h2><div class="sub">'+(S.practica?'Práctica':'Examen')+' · '+secs+'s</div></div>';
  c.innerHTML+='<div class="stats"><div class="stat"><div class="v">'+pts+'</div><div class="k">Aciertos</div></div><div class="stat"><div class="v">'+(total-pts)+'</div><div class="k">Errores</div></div><div class="stat"><div class="v">'+secs+'s</div><div class="k">Tiempo</div></div></div>';
  var bm={};S.answers.forEach(function(a){var m=a.q.m;bm[m]=bm[m]||{t:0,o:0};bm[m].t++;if(a.ok)bm[m].o++;});
  var bd='<div class="lbl">Desglose por módulo</div><div class="bd">';Object.keys(bm).sort().forEach(function(m){var r=bm[m],p=Math.round(r.o/r.t*100);bd+='<div class="bdrow"><div class="bn">'+MODULES[m].short+'</div><div class="bt"><i style="width:'+p+'%;background:'+MODULES[m].color+'"></i></div><div class="bv mono">'+r.o+'/'+r.t+'</div></div>';});bd+='</div>';c.innerHTML+=bd;app.appendChild(c);
  var wrong=S.answers.filter(function(a){return !a.ok;});
  var rc=el('<div class="card plain"></div>');rc.innerHTML='<div class="ov">Revisión</div><h2 class="big" style="font-size:20px;margin-bottom:12px">'+(wrong.length?'Lo que conviene repasar':'Todo correcto')+'</h2>';
  S.answers.forEach(function(a){var q=a.q;rc.innerHTML+='<div class="rev '+(a.ok?'ok':'bad')+'"><div class="rq">'+q.q+'</div><div class="ra '+(a.ok?'g':'r')+'"><i data-lucide="'+(a.ok?'check':'x')+'"></i>'+(a.ok?'Acertaste':'Fallaste')+'</div>'+(a.ok?'':'<div class="rc">Correcto: '+correctAsText(q)+'</div>')+'<div class="re">'+q.e+'</div></div>';});
  app.appendChild(rc);
  var nav=el('<div class="nav"></div>');
  var b1=el('<button class="btn1"><i data-lucide="rotate-ccw"></i> Repetir</button>');b1.onclick=startQuiz;nav.appendChild(b1);
  if(wrong.length){var b2=el('<button class="btn1 btn2"><i data-lucide="book-open"></i> Repasar fallidas</button>');b2.onclick=function(){S.queue=shuffle(wrong.map(function(a){return a.q;}));S.idx=0;S.answers=[];S.ans=S.queue.map(function(){return null;});S.start=Date.now();S.practica=true;renderQuiz();};nav.appendChild(b2);}
  var b3=el('<button class="btn1 btn2"><i data-lucide="home"></i> Inicio</button>');b3.onclick=goHome;nav.appendChild(b3);
  app.appendChild(nav);done();
}
function correctAsText(q){if(q.t==='unica'||q.t==='vf'||q.t==='completar')return q.o[q.c];if(q.t==='multiple')return q.c.map(function(i){return q.o[i];}).join(' + ');if(q.t==='clasificar')return q.items.map(function(it){return '“'+it[0]+'” → '+q.cats[it[1]];}).join('; ');if(q.t==='asociar')return q.pairs.map(function(p){return p[0]+' → '+p[1];}).join('; ');if(q.t==='ordenar')return q.seq.join(' → ');return '';}

function renderHistory(){app.innerHTML='';var c=el('<div class="card"></div>');var hist=store('gh_pnl_hist')||[];
  c.innerHTML='<div class="ov">Tu progreso</div><h2 class="big">Historial de exámenes</h2>';
  if(!hist.length)c.innerHTML+='<div class="empty">Aún no tienes exámenes registrados.<br>Haz un examen y aquí verás tu evolución.</div>';
  else{var best=Math.max.apply(null,hist.map(function(h){return h.pct;}));var avg=Math.round(hist.reduce(function(s,h){return s+h.pct;},0)/hist.length);
    c.innerHTML+='<div class="stats"><div class="stat"><div class="v">'+hist.length+'</div><div class="k">Intentos</div></div><div class="stat"><div class="v">'+best+'%</div><div class="k">Mejor</div></div><div class="stat"><div class="v">'+avg+'%</div><div class="k">Promedio</div></div></div>';
    hist.forEach(function(h){var d=new Date(h.date);var ds=d.toLocaleDateString('es',{day:'2-digit',month:'short'})+' · '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});c.innerHTML+='<div class="hitem"><div class="hp" style="background:'+color(h.pct)+'">'+h.pct+'%</div><div><div class="hd">'+h.correct+' / '+h.total+' correctas</div><div class="hs">'+ds+' · '+h.secs+'s</div></div></div>';});}
  app.appendChild(c);
  var nav=el('<div class="nav"></div>');var b=el('<button class="btn1"><i data-lucide="home"></i> Inicio</button>');b.onclick=goHome;nav.appendChild(b);
  if(hist.length){var b2=el('<button class="btn1 btn2"><i data-lucide="trash-2"></i> Borrar</button>');b2.onclick=function(){if(confirm('¿Borrar todo el historial?')){store('gh_pnl_hist',[]);renderHistory();}};nav.appendChild(b2);}
  app.appendChild(nav);done();
}
renderHome();
</script>
