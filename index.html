<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guerrero Hub · Test de Conocimiento PNL</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F0F4FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Test PNL">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
:root{
  --midnight:#00041C;--royal:#001B7F;--electric:#0045D5;--skyline:#349DFF;--ice:#9DD5FA;
  --white:#fff;--ice-soft:#F0F4FF;--ink:#1A1F2E;--body:#333;--caption:#888;--muted:#999;--hairline:#E4EAF5;
  --accent:#0045D5;--accent-hover:#0038AD;--accent-press:#002E8C;
  --ok:#2E9E57;--ok-bg:#EAF6EE;--ok-ink:#1E6B3B;--bad:#D5334A;--bad-bg:#FCEEF0;--bad-ink:#9B2333;
  --fdisplay:'DM Serif Display',Georgia,serif;--fsans:'DM Sans',ui-sans-serif,system-ui,sans-serif;
  --grad-hero:linear-gradient(135deg,#00041C 0%,#001B7F 55%,#0045D5 100%);
  --grad-premium:linear-gradient(135deg,#00041C 0%,#0045D5 100%);
  --grad-band:linear-gradient(120deg,#001B7F 0%,#0045D5 100%);
  --sh-sm:0 2px 8px rgba(0,4,28,.08);--sh-md:0 8px 24px rgba(0,4,28,.10);--sh-lg:0 18px 48px rgba(0,4,28,.14);
  --sh-cta:0 6px 18px rgba(0,69,213,.28);--ring:0 0 0 3px rgba(52,157,255,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--fsans);color:var(--body);background:var(--ice-soft);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fdisplay);color:var(--midnight);font-weight:400;margin:0;line-height:1.18}
button{font-family:var(--fsans);cursor:pointer;border:none}
i[data-lucide]{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
i[data-lucide] svg{display:block;width:100%;height:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 70px}
.mono{font-variant-numeric:tabular-nums}

/* overline / label */
.ov{font-family:var(--fsans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--electric)}

/* header */
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;position:sticky;top:0;z-index:20;background:var(--midnight);border-bottom:1px solid rgba(255,255,255,.06)}
.top img.logo{height:30px;display:block}
.top .div{width:1px;height:24px;background:rgba(255,255,255,.18)}
.top .tt{font-family:var(--fsans);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ice)}
.top .spacer{flex:1}
.top .hbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:7px 15px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.top .hbtn:hover{background:rgba(255,255,255,.16)}
.top .hbtn i{width:15px;height:15px}

/* card signature */
.card{background:var(--white);border-top:2px solid var(--electric);border-radius:2px 2px 12px 12px;padding:24px;box-shadow:var(--sh-md);margin-bottom:16px}
.card.plain{border-top:1px solid var(--hairline);box-shadow:var(--sh-sm)}
h2.big{font-size:28px;letter-spacing:-.01em;margin-bottom:6px}
.lead{font-size:15px;color:var(--body)}

/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:600px){.modes{grid-template-columns:1fr}}
.mode{border-radius:14px;padding:22px;color:#fff;cursor:pointer;text-align:left;width:100%;border:none;position:relative;overflow:hidden;transition:transform var(--dur,.2s) cubic-bezier(.16,1,.3,1),box-shadow .2s}
.mode:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.mode:active{transform:translateY(1px)}
.mode.p{background:var(--grad-band);box-shadow:var(--sh-md)}
.mode.e{background:var(--grad-premium);box-shadow:var(--sh-md)}
.mode .mi{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.mode .mi i{width:28px;height:28px;color:#fff}
.ghost-btn i{width:19px;height:19px}
.mode h3{font-family:var(--fdisplay);color:#fff;font-size:22px;margin-bottom:5px}
.mode p{margin:0;font-size:13.5px;color:rgba(255,255,255,.9);font-weight:400;line-height:1.5}
.ghost-btn{background:var(--white);border:1px solid var(--hairline);border-radius:10px;padding:13px 16px;font-weight:600;color:var(--ink);font-size:14px;width:100%;margin-top:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost-btn:hover{background:var(--ice-soft)}
.ghost-btn i{width:17px;height:17px;color:var(--electric)}

/* config */
.lbl{font-family:var(--fsans);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--electric);margin:18px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--hairline);background:#fff;border-radius:999px;padding:9px 16px;font-weight:600;font-size:13px;color:var(--body);transition:all .12s}
.chip:hover{border-color:var(--skyline)}
.chip.on{background:var(--midnight);color:#fff;border-color:var(--midnight)}
.chip.on.mc{border-color:transparent}
.backlink{background:none;border:none;color:var(--electric);font-family:var(--fsans);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:2px 0;margin-bottom:14px;cursor:pointer}
.backlink i{width:16px;height:16px}
.backlink:hover{color:var(--accent-hover)}
.modlist{display:flex;flex-direction:column;gap:8px}
.modrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--hairline);border-radius:12px;padding:10px 12px;transition:border-color .12s,background .12s}
.modrow:hover{border-color:var(--skyline)}
.modrow.on{background:var(--ice-soft)}
.modrow .mnum{width:34px;height:34px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fdisplay);font-size:14px;flex:none}
.modrow .mnum i{width:17px;height:17px;color:#fff}
.modrow .mnm{flex:1;font-weight:600;font-size:13.5px;color:var(--ink)}
.modrow .mck{width:22px;height:22px;flex:none;color:var(--electric)}
.modrow .mck i{width:22px;height:22px}
.badge.caso{background:var(--midnight);color:var(--skyline)}
.badge.caso i{width:13px;height:13px}
.start{background:var(--electric);color:#fff;border-radius:10px;padding:16px;font-weight:600;font-size:15px;width:100%;margin-top:24px;box-shadow:var(--sh-cta);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.start:hover{background:var(--accent-hover)}.start:active{transform:translateY(1px)}
.start i{width:18px;height:18px}

/* progress */
.pbar{height:8px;background:#DCE4F5;border-radius:999px;overflow:hidden;margin-bottom:6px}
.pbar>i{display:block;height:100%;background:var(--grad-band);transition:width .35s cubic-bezier(.16,1,.3,1);border-radius:999px}
.meta{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--caption);margin-bottom:14px;letter-spacing:.02em}

/* question */
.qhead{display:flex;align-items:center;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fsans);font-weight:600;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:999px;line-height:1.4;color:#fff}
.badge.soft{background:rgba(0,69,213,.10);color:var(--electric)}
.dbadge{font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.dbadge.basico{background:var(--ok-bg);color:var(--ok-ink)}.dbadge.intermedio{background:#EAF1FF;color:var(--electric)}.dbadge.avanzado{background:#EDE9FB;color:#4B2FB0}
.ttype{font-size:11px;font-weight:600;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.1em}
.qtext{font-family:var(--fdisplay);font-size:21px;color:var(--midnight);line-height:1.3;margin-bottom:16px}
.qimg{width:100%;max-height:270px;object-fit:contain;border-radius:12px;border:1px solid var(--hairline);background:#fafcff;margin-bottom:16px}

/* options */
.opt{display:flex;align-items:center;gap:13px;border:1.5px solid var(--hairline);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s;font-size:15px;font-weight:500;color:var(--ink)}
.opt:hover{border-color:var(--skyline)}
.opt .box{width:24px;height:24px;border-radius:6px;border:2px solid #C3CEE6;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.opt .box i{width:15px;height:15px}
.opt.rad .box{border-radius:50%}
.opt.sel{border-color:var(--electric);background:var(--ice-soft)}
.opt.sel .box{background:var(--electric);border-color:var(--electric)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}.opt.ok .box{background:var(--ok);border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}.opt.bad .box{background:var(--bad);border-color:var(--bad)}
.opt.dis{pointer-events:none}

/* classify */
.citem{border:1.5px solid var(--hairline);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.citem .ct{font-weight:600;color:var(--ink);font-size:15px;margin-bottom:9px}
.catbtns{display:flex;flex-wrap:wrap;gap:7px}
.catbtn{border:1.5px solid var(--hairline);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;font-size:12.5px;color:var(--body)}
.catbtn:hover{border-color:var(--skyline)}
.catbtn.sel{background:var(--midnight);color:#fff;border-color:var(--midnight)}
.catbtn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.catbtn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}

/* match */
.mrow2{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.mrow2 .ml{flex:1;border:1.5px solid var(--hairline);border-radius:10px;padding:12px 14px;font-weight:600;color:var(--ink);font-size:14px;background:var(--ice-soft);min-width:0}
.mrow2 .arri{color:var(--skyline);flex:none}
.mrow2 select{flex:1;border:1.5px solid var(--hairline);border-radius:10px;padding:12px;font-size:14px;font-family:var(--fsans);font-weight:500;color:var(--body);background:#fff;min-width:0;max-width:100%}
.mrow2 select:focus{outline:none;box-shadow:var(--ring);border-color:var(--skyline)}
.mrow2 select.ok{border-color:var(--ok);background:var(--ok-bg)}.mrow2 select.bad{border-color:var(--bad);background:var(--bad-bg)}@media(max-width:560px){.mrow2{flex-direction:column;align-items:stretch;gap:6px}.mrow2 .arri{display:none}.mrow2 .ml,.mrow2 select{flex:none;width:100%}}

/* order */
.oitem{display:flex;align-items:center;gap:12px;border:1.5px solid var(--hairline);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#fff}
.oitem .on{width:27px;height:27px;border-radius:8px;background:var(--midnight);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.oitem .otx{flex:1;font-weight:500;font-size:14px;color:var(--ink)}
.oitem .arr{display:flex;flex-direction:column;gap:3px}
.oitem .arr button{background:var(--ice-soft);border-radius:6px;width:28px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--electric)}
.oitem .arr button i{width:13px;height:13px}
.oitem .arr button:hover{background:var(--ice)}
.oitem.ok{border-color:var(--ok);background:var(--ok-bg)}.oitem.bad{border-color:var(--bad);background:var(--bad-bg)}

/* hint (completion counter) */
.hint{font-size:12.5px;font-weight:600;color:var(--caption);margin-top:6px;display:flex;align-items:center;gap:6px}
.hint i{width:15px;height:15px;color:var(--skyline)}
.hint.done{color:var(--ok)}.hint.done i{color:var(--ok)}

/* feedback (alert) */
.fb{display:flex;gap:12px;align-items:flex-start;border-radius:8px;padding:14px 16px;margin-top:12px;border-left:3px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--bad)}
.fb .fi{flex:none;margin-top:1px}.fb .fi i{width:19px;height:19px}
.fb.ok .fi i{color:var(--ok)}.fb.bad .fi i{color:var(--bad)}
.fb b{font-family:var(--fsans);font-weight:600;font-size:14px;display:block;margin-bottom:3px}
.fb.ok b{color:var(--ok-ink)}.fb.bad b{color:var(--bad-ink)}
.fb .expl{font-size:13.5px;line-height:1.55;color:var(--body)}

.nav{display:flex;gap:10px;margin-top:18px}
.nav button{flex:1;border-radius:10px;padding:15px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .2s}
.nav .navback{flex:0 0 auto;padding-left:18px;padding-right:18px}
.nav .navback:disabled{opacity:.4;cursor:not-allowed}
.nav button i{width:18px;height:18px}
.btn1{background:var(--electric);color:#fff;box-shadow:var(--sh-cta)}.btn1:hover{background:var(--accent-hover)}.btn1:active{transform:translateY(1px)}
.btn1:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn2{background:#fff;border:1.5px solid var(--royal)!important;color:var(--royal)}.btn2:hover{background:var(--royal);color:#fff}

/* results */
.score{text-align:center;padding:6px 0 4px}
.ring{width:148px;height:148px;margin:0 auto 12px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ring .pct{font-family:var(--fdisplay);font-size:44px;line-height:1}
.ring .lab{font-size:12px;font-weight:600;opacity:.92;letter-spacing:.04em}
.score h2{font-size:24px;margin-bottom:4px}
.score .sub{color:var(--caption);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:18px 0}
.stat{background:var(--ice-soft);border-radius:10px;padding:14px;text-align:center}
.stat .v{font-family:var(--fdisplay);font-size:22px;color:var(--midnight)}
.stat .k{font-size:10.5px;font-weight:600;color:var(--caption);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
.bd{margin:4px 0}
.bdrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;font-weight:600}
.bdrow .bn{width:130px;color:var(--ink)}
.bdrow .bt{flex:1;height:8px;background:#DCE4F5;border-radius:999px;overflow:hidden}
.bdrow .bt>i{display:block;height:100%;border-radius:999px}
.bdrow .bv{width:48px;text-align:right;color:var(--caption)}
.rev{border-left:3px solid var(--hairline);padding:8px 0 8px 14px;margin-bottom:14px}
.rev.ok{border-color:var(--ok)}.rev.bad{border-color:var(--bad)}
.rev .rq{font-weight:600;color:var(--ink);font-size:14px;margin-bottom:5px}
.rev .ra{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rev .ra i{width:15px;height:15px}
.rev .ra.g{color:var(--ok)}.rev .ra.r{color:var(--bad)}
.rev .rc{font-size:13px;color:var(--midnight);font-weight:600;margin-top:3px}
.rev .re{font-size:12.5px;color:var(--caption);margin-top:4px;line-height:1.5}

/* history */
.hitem{display:flex;align-items:center;gap:13px;border:1px solid var(--hairline);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.hitem .hp{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--fdisplay);font-size:15px;flex:none}
.hitem .hd{font-weight:600;color:var(--ink);font-size:14px}
.hitem .hs{font-size:12px;color:var(--caption);font-weight:500}
.empty{text-align:center;color:var(--caption);padding:28px 10px;font-weight:500;line-height:1.6}
.foot{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;font-weight:500;letter-spacing:.02em}
.hide{display:none}
</style>
</head>

var BANK = [
{m:1,t:"unica",d:"basico",q:"¿Cuál es la presuposición central de la PNL sobre la realidad?",o:["El mapa no es el territorio","La realidad es igual para todos","Solo existe lo que se puede medir","El lenguaje no influye en la mente"],c:0,e:"Cada persona vive dentro de su representación interna (su mapa), que nunca es la realidad misma (el territorio)."},
{m:1,t:"vf",d:"basico",q:"Según la PNL, todos percibimos la misma realidad objetiva, sin filtros.",o:["Verdadero","Falso"],c:1,e:"Falso: cada quien construye un 'mapa' distinto con lenguaje e imágenes. El mapa no es el territorio."},
{m:1,t:"completar",d:"basico",q:"La PNL plantea que pensamos en dos códigos: imágenes y ______.",o:["lenguaje","números","emociones","sonidos"],c:0,e:"Los dos códigos son las imágenes (cine interno) y el lenguaje (las etiquetas verbales)."},
{m:1,t:"unica",d:"intermedio",q:"Una persona se repite a diario 'soy malo para hablar en público' y por eso evita toda exposición. ¿Qué principio ilustra?",o:["Como hablamos, pensamos","El mapa es igual al territorio","La intención positiva","La fórmula de Miller"],c:0,e:"El lenguaje interno no describe la realidad: la fabrica. Repetir la etiqueta refuerza la conducta."},
{m:1,t:"asociar",d:"intermedio",q:"Empareja cada vértice del triángulo semiótico con lo que representa:",pairs:[["Objeto real","La cosa tal cual, antes de nombrarla"],["Imaginario","La imagen mental que te haces"],["Simbólico","La palabra que la nombra"]],e:"La palabra (símbolo) está a dos pasos de la realidad: nombra una imagen mental de un objeto real."},
{m:1,t:"unica",d:"intermedio",q:"En el eje 'Querer → ______ → Poder', ¿qué actúa como puente entre el querer y los resultados?",o:["Las creencias","El talento","La suerte","El esfuerzo físico"],c:0,e:"Las creencias son la flecha que convierte (o bloquea) el querer en poder/resultados."},
{m:1,t:"vf",d:"intermedio",q:"Presuposición PNL: todo comportamiento, aunque parezca dañino, tiene una intención positiva por debajo.",o:["Verdadero","Falso"],c:0,e:"Es teleológico: toda conducta persigue un propósito. Conviene preguntar '¿qué busca conseguir con esto?'."},
{m:1,t:"unica",d:"avanzado",caso:true,q:"Tu socio llega tarde a cada reunión y te molesta. Desde la PNL, ¿cuál es la lectura más útil?",o:["Detrás de su tardanza hay una intención positiva","Su tardanza revela un rasgo fijo de su personalidad","Conviene anclarle un recurso para que cambie","Su conducta busca desestabilizarte a propósito"],c:0,e:"Toda conducta tiene intención positiva. En vez de juzgar, preguntas qué gana o qué evita con eso."},
{m:1,t:"clasificar",d:"avanzado",q:"Clasifica cada frase como TERRITORIO o MAPA:",cats:["Territorio","Mapa"],items:[["Son las 3:00 p.m.",0],["Mi jefe me tiene manía",1],["No respondió el correo en 2 horas",0],["Le caigo mal a todo el equipo",1],["Hoy hay 20 °C",0]],e:"Los hechos son verificables; el resto son interpretaciones (mapa). Confundirlos genera la mayoría de los conflictos."},
{m:1,t:"unica",d:"basico",q:"'El mapa no es el territorio' significa que…",o:["El lenguaje refleja la realidad tal cual es","Tu representación mental no es lo real","Cada territorio tiene un solo mapa correcto","La realidad objetiva no existe para nadie"],c:1,e:"Operamos con nuestra representación de la realidad, no con la realidad directa."},
{m:1,t:"unica",d:"avanzado",q:"¿Cuál es el MEJOR ejemplo de 'como hablamos, pensamos'?",o:["Un equipo llama 'retos' a los problemas y suma recursos","Elegir palabras difíciles hace que las ideas suenen profundas","Hablar en voz alta ordena y aclara los pensamientos","Repetir mucho una frase termina por volverla cierta"],c:0,e:"Cambiar la etiqueta ('reto' vs 'problema') cambia la actitud y la respuesta ante lo mismo."},
{m:1,t:"multiple",d:"intermedio",q:"¿En qué dos códigos representa la mente la experiencia? (elige 2)",o:["Imágenes","Lenguaje","Telepatía","Estadística pura"],c:[0,1],e:"Imágenes (representaciones sensoriales) y lenguaje (etiquetas verbales). Traducir de uno a otro pierde información."},
{m:1,t:"ordenar",d:"avanzado",q:"Ordena cómo se forma un malentendido, desde el origen:",seq:["Vives una experiencia rica y completa","Tu mente la convierte en imágenes/representaciones","La resumes en palabras (se pierde info)","El otro la interpreta con SU propio mapa"],e:"Entre lo que vives y lo que el otro entiende hay dos traducciones con pérdida: por eso conviene preguntar."},
{m:1,t:"unica",d:"intermedio",q:"'La palabra silla no es una silla; es el símbolo de una imagen mental de un objeto real.' Esto ilustra…",o:["La fórmula 7±2 de la memoria","Que el mapa no es el territorio","El principio de anclaje sensorial","La intención positiva de la conducta"],c:1,e:"Objeto–imagen–símbolo: la palabra está a dos pasos de lo real."},
{m:2,t:"unica",d:"basico",q:"Según el modelo del iceberg, ¿qué porcentaje de la mente es inconsciente?",o:["95%","50%","25%","5%"],c:0,e:"5% consciente / 95% inconsciente: la mayor parte de las decisiones se toma abajo de la línea de agua."},
{m:2,t:"vf",d:"basico",q:"El reparto exacto 5% / 95% consciente–inconsciente es una cifra científica medida con precisión.",o:["Verdadero","Falso"],c:1,e:"Falso: es una metáfora divulgativa muy útil, no un dato exacto. Sirve como imagen del peso del inconsciente."},
{m:2,t:"unica",d:"basico",q:"La fórmula '7 ± 2' fue formulada por…",o:["George Miller, en Harvard, hacia 1956","La Universidad de Chicago en los años 50","Sigmund Freud, en su teoría del inconsciente","Richard Bandler, cofundador de la PNL"],c:0,e:"George Miller la publicó en 1956 estando en Harvard. ('Universidad de Chicago' es una atribución errónea muy repetida.)"},
{m:2,t:"unica",d:"intermedio",q:"¿Qué mide realmente el '7 ± 2' de Miller?",o:["La capacidad de la memoria a largo plazo","El número de ideas que retiene el oído","El límite de la memoria de trabajo","La rapidez de procesamiento del cerebro"],c:2,e:"Es un límite de la memoria de trabajo consciente: entre 5 y 9 'trozos' de información simultáneos."},
{m:2,t:"unica",d:"intermedio",q:"La lección práctica del '7 ± 2' para comunicar es:",o:["Menos ideas, pero más nítidas","Decir la mayor cantidad de datos posible","Repetir todo tres veces","Hablar rápido"],c:0,e:"Si saturas el cuello de botella consciente, el mensaje rebota. Elige pocas ideas y hazlas golpear."},
{m:2,t:"clasificar",d:"intermedio",q:"Clasifica cada característica según el hemisferio que la procesa:",cats:["Hemisferio izquierdo","Hemisferio derecho"],items:[["Datos, lógica y lenguaje",0],["Emoción, imágenes e intuición",1],["Procesa de forma secuencial",0],["Procesa de forma global y creativa",1]],e:"Izquierdo = razón/consciente; derecho = emoción/inconsciente. Es un modelo de comunicación, no anatomía estricta."},
{m:2,t:"vf",d:"avanzado",q:"El 'izquierdo = lógica / derecho = creatividad' de forma tajante es ciencia probada y exacta.",o:["Verdadero","Falso"],c:1,e:"Falso: es una simplificación (neuromito). Ambos lados colaboran. Vale como brújula de comunicación, no como anatomía."},
{m:2,t:"ordenar",d:"intermedio",q:"Ordena la cadena de Marilyn Ferguson:",seq:["Creencia","Pensamiento","Acción","Resultado"],e:"Creencia → pensamiento → acción → resultado. Si repites la creencia, repites el resultado."},
{m:2,t:"unica",d:"intermedio",q:"Según Ferguson, ¿cuál es el ÚNICO punto de palanca real para cambiar tus resultados?",o:["La creencia","El esfuerzo","La suerte","El entorno"],c:0,e:"No es esforzarse más ni pensar distinto por voluntad: hay que cambiar la creencia de raíz."},
{m:2,t:"unica",d:"avanzado",caso:true,q:"Un cliente dice que compró el auto 'por seguridad', pero en el fondo lo movió el estatus. ¿Qué concepto lo explica?",o:["El motivo real se decide en el 95% inconsciente","La saturación de la memoria de trabajo 7±2","El triángulo semiótico entre signo, objeto y referente","Una generalización del mapa sobre la realidad"],c:0,e:"El motivo consciente ('seguridad') suele tapar el motivo inconsciente real. Se decide abajo del iceberg."},
{m:2,t:"vf",d:"intermedio",q:"Para influir de verdad conviene hablarle sobre todo a la mente consciente y racional.",o:["Verdadero","Falso"],c:1,e:"Falso: la decisión ocurre en el 95% inconsciente. El dato abre la puerta, pero la emoción decide."},
{m:2,t:"multiple",d:"intermedio",q:"¿Cuáles son funciones típicas del hemisferio DERECHO? (elige todas)",o:["Imágenes","Emoción e intuición","Cálculo secuencial","Pensamiento global/creativo"],c:[0,1,3],e:"El derecho: imágenes, emoción, intuición, lo global y creativo. El cálculo secuencial es del izquierdo."},
{m:2,t:"completar",d:"basico",q:"La mente consciente maneja entre 5 y ______ unidades de información a la vez.",o:["9","3","20","100"],c:0,e:"7 ± 2 = entre 5 y 9 unidades. Por eso conviene simplificar el mensaje."},
{m:2,t:"unica",d:"avanzado",q:"En una presentación das 12 argumentos sólidos y el cliente no reacciona. La causa más probable es:",o:["Los argumentos estaban mal ordenados","No tocaste el dolor del cliente","Colapsaste el consciente con 7±2","Faltó anclar una emoción clara"],c:2,e:"Demasiadas piezas colapsan el cuello de botella consciente. Menos ideas, más nítidas."},
{m:3,t:"unica",d:"basico",q:"Los tres patrones que empobrecen el lenguaje en el Metamodelo son:",o:["Generalización, omisión y distorsión","Lo visual, lo auditivo y lo kinestésico","El emisor, el receptor y el canal","El pasado, el presente y el futuro"],c:0,e:"Al pasar la experiencia a palabras, la mente generaliza, omite y distorsiona. El Metamodelo lo corrige con preguntas."},
{m:3,t:"unica",d:"intermedio",img:"metamodelo",q:"Entre los 3 filtros del Metamodelo, ¿cuál se rompe recuperando el dato que falta, con las preguntas de Wilson?",o:["Omisión","Generalización","Distorsión","Anclaje"],c:0,e:"La omisión deja huecos (falta el dato). Se completa con las preguntas de Wilson: qué, cómo, cuándo, dónde, cuánto."},
{m:3,t:"clasificar",d:"intermedio",q:"Clasifica cada frase según su patrón del Metamodelo:",cats:["Generalización","Omisión","Distorsión"],items:[["Nunca me escuchan",0],["Esto está mal hecho",1],["Me miró y supe que me odia",2],["Todos los políticos mienten",0],["Si me quisiera, me llamaría",2]],e:"Generalización = 'siempre/nunca/todos'. Omisión = falta el dato. Distorsión = enlaza A con B sin que A cause B."},
{m:3,t:"unica",d:"intermedio",q:"Ante 'El proyecto va mal', ¿qué pregunta rompe la OMISIÓN?",o:["¿Va mal siempre, en todos los casos?","¿Qué parte y cuánto, exactamente?","¿Quién tiene la culpa de todo esto?","¿Y eso por qué te preocupa tanto?"],c:1,e:"La omisión se rompe recuperando el dato faltante con las preguntas de precisión (Wilson)."},
{m:3,t:"unica",d:"avanzado",q:"Distorsión: 'Me miró mal, le caigo mal.' ¿Cuál es la MEJOR pregunta para desarmarla?",o:["¿Alguien a quien le caes bien te ha mirado así?","¿Por qué siempre piensas lo peor de la gente?","¿Y qué piensas hacer al respecto a partir de ahora?","¿Estás completamente seguro de esa conclusión?"],c:0,e:"Cuestionas el vínculo falso A→B con un contraejemplo. Así se afloja la interpretación."},
{m:3,t:"asociar",d:"intermedio",q:"Asocia cada patrón con la pregunta que lo rompe:",pairs:[["Generalización","¿Siempre? ¿Nunca? ¿Alguna vez fue distinto?"],["Omisión","¿Qué, cómo, cuándo, dónde, cuánto?"],["Distorsión","¿A siempre causa B? ¿Ha pasado A sin B?"]],e:"Cada filtro tiene su antídoto: excepción (generalización), dato faltante (omisión), vínculo (distorsión)."},
{m:3,t:"unica",d:"basico",q:"Las 'preguntas clave de Wilson' para recuperar información son:",o:["Quién, cuál, por qué y desde cuándo","Cómo, por qué, cuánto y siempre","Qué, cómo, cuándo, dónde y cuánto","Qué, quién, por qué y para qué"],c:2,e:"Son las preguntas de precisión que rellenan lo que la omisión borró."},
{m:3,t:"unica",d:"intermedio",img:"wilson",q:"Esta lámina reúne las preguntas '¿qué?, ¿cómo?, ¿cuándo?, ¿dónde?, ¿cuánto?'. ¿Qué representan?",o:["Preguntas que recuperan lo omitido","Los dos hemisferios del cerebro humano","El iceberg de lo inconsciente","Las etapas del ciclo de valor"],c:0,e:"Son las preguntas (qué, cómo, cuándo, dónde, cuánto…) para completar la omisión."},
{m:3,t:"unica",d:"intermedio",img:"romper_omision",q:"La frase 'cuántos quiénes hacen qué, para que pase qué, de qué manera' sirve para romper el patrón de…",o:["Omisión","Generalización","Distorsión","Anclaje"],c:0,e:"Es la fórmula maestra de Wilson: recupera toda la información omitida de una situación difusa."},
{m:3,t:"vf",d:"basico",q:"El Metamodelo se aplica atacando y contradiciendo a la persona.",o:["Verdadero","Falso"],c:1,e:"Falso: se aplica con PREGUNTAS que ayudan a la persona a recuperar información y ver su propia grieta."},
{m:3,t:"completar",d:"intermedio",q:"Generalización = convertir un solo caso en una ______ universal.",o:["regla","excepción","emoción","pregunta"],c:0,e:"Ej.: 'una vez fallé' → 'siempre fallo'. Se rompe buscando la excepción."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"Cliente en ventas: 'Sus precios son muy altos.' ¿Qué pregunta de recuperación aplica mejor?",o:["¿Le parece que no valen ese precio?","¿Nunca ha pagado un precio así de alto?","¿Altos frente a qué, exactamente?","¿Cuánto esperaba gastar en esto?"],c:2,e:"'Alto' es una comparación omitida. Recuperas el estándar oculto con '¿comparado con qué?'."},
{m:3,t:"unica",d:"basico",q:"El objetivo del Metamodelo es…",o:["Recuperar información perdida y precisar el mapa","Ganar la discusión con argumentos mejor armados","Ordenar las ideas para expresarlas con claridad","Detectar cuándo la otra persona te está mintiendo"],c:0,e:"Devuelve nitidez al mapa empobrecido por generalización, omisión y distorsión."},
{m:3,t:"clasificar",d:"avanzado",q:"Clasifica estas frases más sutiles según su patrón:",cats:["Generalización","Omisión","Distorsión"],items:[["Aquí nadie ayuda",0],["Deberíamos mejorar",1],["Ganó porque tuvo suerte",2],["Es imposible para todos",0]],e:"'Nadie/todos' = generalización; falta de referente = omisión; causa inventada = distorsión."},
{m:4,t:"unica",d:"basico",q:"En el trabajo de creencias, detrás de cada 'No' hay…",o:["Una creencia que hay que discutir","Un miedo que conviene evitar","Una pregunta que abre camino","Una decisión ya tomada y firme"],c:2,e:"La creencia limitante se disuelve al convertirla en pregunta, no al discutirla de frente."},
{m:4,t:"unica",d:"intermedio",img:"detras_no",q:"¿Qué pregunta desarma la creencia 'No puedo'?",o:["¿Qué te lo impide?","¿Qué pasaría si lo hicieras?","¿Qué o cuánto sí tienes?","¿Quién sí lo sabe?"],c:0,e:"'No puedo' es un operador modal de posibilidad; se abre con '¿qué te lo impide, exactamente?'."},
{m:4,t:"asociar",d:"intermedio",q:"Empareja cada creencia con la pregunta que la abre:",pairs:[["No puedo","¿Qué te lo impide, exactamente?"],["No debo","¿Qué pasaría si lo hiciéramos?"],["No tengo","¿Qué o cuánto sí tienes?"],["No sé","¿Qué o quién sí lo sabe?"]],e:"Cada 'No' tiene su pregunta-llave que revela el obstáculo, la regla, el recurso o el camino."},
{m:4,t:"ordenar",d:"intermedio",q:"Ordena los 5 pasos del Metamodelo para modificar una creencia negativa:",seq:["Evalúa qué tan cierta o falsa es","Identifica el tipo (generalización, omisión o distorsión)","Haz la pregunta que la desarma","Responde esa pregunta","Pregúntate: ¿cómo puedo lograrlo?"],e:"Evaluar → tipificar → preguntar → responder → accionar. El paso 5 convierte el desarme en acción."},
{m:4,t:"unica",d:"avanzado",q:"Creencia: 'No sirvo para hablar en público.' En el proceso de 5 pasos, el paso 2 la clasificaría como:",o:["Una generalización","Una distorsión de causa","Una omisión de datos","Un anclaje aprendido"],c:0,e:"'No sirvo (nunca, para nada)' generaliza. Se rompe con la excepción: '¿alguna vez salió bien?'."},
{m:4,t:"clasificar",d:"avanzado",q:"Clasifica cada creencia como SUPERFICIAL o PROFUNDA:",cats:["Superficial","Profunda"],items:[["No sé usar el CRM nuevo",0],["No soy bueno para las ventas",1],["No manejo bien PowerPoint",0],["La gente como yo no triunfa",1]],e:"Superficial = habilidad puntual (se arregla con práctica). Profunda = toca el 'yo soy'. Empieza por las superficiales."},
{m:4,t:"vf",d:"intermedio",q:"Conviene atacar primero las creencias profundas de identidad.",o:["Verdadero","Falso"],c:1,e:"Falso: empieza por las superficiales para generar movimiento y confianza; luego tocas el fondo."},
{m:4,t:"unica",d:"intermedio",q:"'No puedo subir mis precios.' ¿Qué pregunta la desarma mejor?",o:["¿De verdad nunca podrás subirlos?","¿Y si pruebas y ves qué pasa?","¿Quién dijo que no se puede hacer?","¿Qué te lo impide, exactamente?"],c:3,e:"Revela el obstáculo real, que casi siempre es un miedo, no el mercado."},
{m:4,t:"unica",d:"avanzado",q:"¿Por qué preguntar funciona mejor que afirmar al cambiar una creencia ajena?",o:["Lo que uno descubre por sí mismo no se discute","Preguntar siempre resulta más educado y menos brusco","Una pregunta se responde en mucho menos tiempo","Así se esquiva entrar en el tema incómodo real"],c:0,e:"La pregunta hace que la persona encuentre sola la grieta de su muro; no genera la resistencia de la afirmación."},
{m:4,t:"completar",d:"basico",q:"La creencia es el puente entre el querer y el ______.",o:["poder","tener","saber","hablar"],c:0,e:"Enlaza con el Bloque 1: Querer → (Creencias) → Poder."},
{m:4,t:"unica",d:"intermedio",q:"El paso final del proceso, preguntarte '¿cómo puedo lograrlo?', sirve para…",o:["Reforzar la creencia ya desarmada","Pasar del desarme a la acción","Analizar por qué surgió el No","Confirmar que el problema existe"],c:1,e:"Desarmar no basta: hay que reemplazar la creencia vieja por un camino de acción."},
{m:4,t:"vf",d:"basico",q:"Una creencia limitante es siempre un hecho comprobado.",o:["Verdadero","Falso"],c:1,e:"Falso: casi siempre es una interpretación (mapa), no un hecho (territorio). Por eso se puede reescribir."},
{m:4,t:"unica",d:"avanzado",q:"Alguien cree: 'Todos me van a rechazar.' ¿Cuál es la mejor pregunta para desarmarla?",o:["¿Alguna vez alguien no te rechazó?","¿Por qué estás tan seguro de eso?","¿Y si esta vez ellos tuvieran razón?","¿Quién te hizo daño en el pasado?"],c:0,e:"Es una generalización ('todos'); la excepción la quiebra al instante."},
{m:4,t:"multiple",d:"intermedio",q:"¿Cuáles de estos SÍ son pasos del proceso de 5 pasos para modificar creencias? (elige todos)",o:["Evaluar qué tan cierta o falsa es","Identificar el tipo de creencia","Repetir la creencia en voz alta 10 veces","Preguntarte cómo puedes lograrlo"],c:[0,1,3],e:"Repetir la creencia negativa la refuerza; no es parte del proceso. Los otros tres sí lo son."},
{m:5,t:"unica",d:"basico",q:"La gran idea de la comunicación de alto impacto es:",o:["Convencerlo con la mayor cantidad de datos","Ser quien le resuelve un dolor al cliente","Exponer todas las bondades de tu producto","Crear urgencia para que decida cuanto antes"],c:1,e:"El interés real nace cuando el cliente reconoce su dolor y te ve a ti como la salida."},
{m:5,t:"unica",d:"intermedio",img:"quien_que_motivo",q:"En el modelo Quién–Qué–Motivo, ¿qué representa 'el motivo'?",o:["Lo inconsciente: lo que necesita aunque no lo diga","La necesidad lógica que expresa de forma abierta","El argumento racional que justifica su compra","El presupuesto exacto que destina al producto elegido"],c:0,e:"El motivo apunta al 95% inconsciente: los deseos y miedos reales detrás del pedido explícito."},
{m:5,t:"ordenar",d:"intermedio",q:"Ordena el modelo 'Yo quiero que quién haga qué y por qué motivo':",seq:["Emisor (yo quiero)","Receptor (que quién)","Objetivo (haga qué: actúe/sienta/piense)","Motivo (por qué: lo inconsciente)"],e:"Diseñas el mensaje decidiendo a quién, para qué acción/emoción/pensamiento, y apuntando al motivo profundo."},
{m:5,t:"asociar",d:"intermedio",q:"Asocia cada pieza del modelo con su definición:",pairs:[["Emisor","Quien comunica una necesidad"],["Receptor","A quién va dirigido el mensaje"],["Objetivo","Que la persona actúe, sienta o piense algo"],["Motivo","Lo que realmente necesita"]],e:"Quién–Qué–Motivo: el motivo es el que casi todos olvidan, y es el que decide."},
{m:5,t:"unica",d:"avanzado",q:"'Un decano no necesita un curso; necesita bajar la deserción y quedar bien ante el consejo.' Esto ilustra hablarle al…",o:["Al pedido explícito y literal","Al motivo real tras el pedido","Al 5% consciente y racional","Al argumento técnico del curso"],c:1,e:"Le hablas a lo que realmente necesita (el 95%), no a lo que pide literalmente."},
{m:5,t:"unica",d:"basico",img:"preg_estrategicas",q:"Las tres preguntas estratégicas de enfoque son:",o:["¿Qué quiero? ¿Qué tengo? ¿Qué falta?","¿Quién? ¿Cómo? ¿Cuándo?","¿Cuánto cuesta? ¿Cuándo pagas? ¿Dónde firmas?","¿Por qué? ¿Para qué? ¿Con quién?"],c:0,e:"Definir con claridad (qué quiero), medir lo que importa (qué tengo) y actuar sobre el vacío (qué falta)."},
{m:5,t:"ordenar",d:"basico",q:"Ordena la secuencia persuasiva de la conversación de alto impacto:",seq:["Dolor","Beneficio","Ventaja"],e:"Abres con el dolor (engancha), sigues con el beneficio (argumento) y cierras con la ventaja (por qué tú)."},
{m:5,t:"unica",d:"intermedio",q:"'Entrar por la izquierda, cerrar por la derecha' significa:",o:["Primero el dato, luego la emoción","Arrancar por la conclusión final","Hablar apoyado solo en cifras","Convencer solo con relatos e historias"],c:0,e:"El dato da el permiso racional; la emoción cruza y decide. Es la secuencia de los hemisferios aplicada."},
{m:5,t:"unica",d:"avanzado",q:"En una conversación de alto impacto, lo correcto respecto a los hemisferios es:",o:["Mantenerte firme solo en la razón lógica","Apelar únicamente a la emoción del otro","Ir y venir entre la razón y la emoción","Separar por completo razón de emoción"],c:2,e:"Solo razón suena frío; solo emoción suena vacío. La maestría es el péndulo entre ambos."},
{m:5,t:"unica",d:"avanzado",q:"'Reduces la deserción y lo logras CONMIGO, que soy quien mejor entiende ese problema.' Esta frase es un(a):",o:["Ventaja","Característica","Beneficio","Objeción"],c:0,e:"Lleva tu nombre ('conmigo') y es diferencial: solo tú puedes decirla. Eso la hace ventaja, no beneficio."},
{m:5,t:"clasificar",d:"avanzado",q:"Clasifica cada frase como Característica, Beneficio o Ventaja:",cats:["Característica","Beneficio","Ventaja"],items:[["El programa dura 40 horas",0],["Forma a tu equipo sin frenar operaciones",1],["Conmigo, con soporte local que nadie más ofrece",2],["Batería de 5000 mAh",0],["Te dura todo el día",1],["El único que carga completo en 15 minutos",2]],e:"Característica = qué es (dato). Beneficio = qué produce (sirve también para el competidor). Ventaja = qué gana CONTIGO (diferencial)."},
{m:5,t:"unica",d:"intermedio",q:"Truco infalible para distinguir beneficio de ventaja:",o:["Si tu competencia también la diría, es beneficio; si solo tú, ventaja","Si la frase incluye una cifra concreta es ventaja; si no, es beneficio","El beneficio dice qué es o qué tiene; la ventaja, qué logra el cliente","Si aporta valor real al cliente es ventaja; si te sirve a ti, beneficio"],c:0,e:"La ventaja es el beneficio vuelto personal y diferencial: solo tú puedes prometerla."},
{m:5,t:"unica",d:"intermedio",q:"En Dolor → Beneficio → Ventaja, ¿con qué se ABRE la conversación?",o:["Con tu ventaja diferencial","Con el beneficio principal","Con el dolor del cliente","Con tu experiencia previa"],c:2,e:"Sin dolor reconocido no hay interés. Primero nombras la carga del otro."},
{m:5,t:"vf",d:"intermedio",q:"El ciclo de valor del selfmarketing es: a quién ayudas → qué ofreces → qué recibes.",o:["Verdadero","Falso"],c:0,e:"Identificas al cliente y su dolor, ofreces beneficios/ventajas, y de ahí se deriva lo que recibes. Es intercambio de valor."},
{m:5,t:"unica",d:"avanzado",caso:true,q:"Quieres que un cliente ACTÚE y compre. Según el modelo, lo PRIMERO que debes hacer es:",o:["Identificar y nombrar su dolor con precisión","Mostrar todas las características del producto","Ofrecer un descuento","Hablar de ti"],c:0,e:"El dolor reconocido es el gancho; recién ahí el beneficio y la ventaja tienen dónde aterrizar."},
{m:5,t:"multiple",d:"avanzado",q:"¿Cuáles de estas frases son VENTAJAS (no simples beneficios)? (elige todas)",o:["Conmigo obtienes una garantía exclusiva","Reduce el tiempo dedicado a los reportes","Soy el único certificado de tu ciudad","Aumenta la productividad de tu equipo"],c:[0,2],e:"Las ventajas son diferenciales y personales ('conmigo', 'el único'). 'Ahorra tiempo' y 'mejora productividad' las diría cualquier competidor: son beneficios."},
{m:5,t:"completar",d:"basico",q:"Característica responde a '¿qué tiene?'; beneficio a '¿para qué me sirve?'; ventaja a '¿por qué ______ y no otro?'.",o:["tú","yo","él","nadie"],c:0,e:"La ventaja responde por qué elegirte a TI frente a las demás opciones."},
{m:1,t:"unica",d:"intermedio",caso:true,q:"Tu pareja no respondió tus mensajes en todo el día y piensas: 'ya no le importo'. Desde la PNL, ¿qué te conviene hacer primero?",o:["Reclamarle en cuanto responda el mensaje","Ver que es interpretación, no un hecho","Dar por hecho lo peor y tomar distancia","Revisar sus redes para poder confirmarlo"],c:1,e:"'Ya no le importo' es tu mapa, no el territorio. Primero separas el hecho (no contestó) de tu interpretación."},
{m:2,t:"unica",d:"avanzado",caso:true,q:"Un cliente dice que no compró 'por el precio', pero notaste que dudaba de si el producto le serviría. ¿Qué conviene atender?",o:["El motivo real inconsciente: su miedo a que falle","El precio real: ofrecerle un buen descuento ya","Las características técnicas para probar su calidad","Nada, esa venta ya está definitivamente perdida"],c:0,e:"El motivo declarado (precio) suele tapar el real (miedo/inseguridad). Se decide en el 95% inconsciente."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"Tu colaboradora te dice, frustrada: 'Este cliente es imposible, nunca vamos a cerrar con él.' ¿Cuál es la mejor intervención?",o:["'Dale la razón y cambia de cliente'","'Explícale que debe ser positiva'","'¿Nunca? ¿En qué sí avanzaron?'","'Habla tú con el cliente directamente'"],c:2,e:"'Nunca/imposible' es una generalización; buscar la excepción la abre y baja la frustración."},
{m:4,t:"unica",d:"avanzado",caso:true,q:"Un amigo emprendedor te dice: 'No puedo cobrar más caro, la gente no paga eso.' ¿Qué le preguntas para desarmar la creencia?",o:["¿Qué te lo impide? ¿Alguien ahí cobra más?","¿Por qué eres tan inseguro contigo?","Entonces no intentes subir tus precios ahora","¿Cuánto necesitas ganar realmente?"],c:0,e:"Unes el reto del 'No puedo' con la búsqueda de la excepción; casi siempre el freno es un miedo, no el mercado."},
{m:5,t:"unica",d:"intermedio",caso:true,q:"Un cliente te pregunta directo: '¿Por qué te contrataría a ti y no a otro?' ¿Qué tipo de respuesta necesita?",o:["Una característica técnica del servicio","El precio más bajo de todo el mercado","Una ventaja, algo diferencial tuyo","El listado de tus estudios y diplomas"],c:2,e:"'¿Por qué tú y no otro?' se responde con una ventaja (diferencial, 'conmigo'), no con una característica."},
{m:5,t:"ordenar",d:"avanzado",caso:true,q:"Vas a reunirte con una universidad que pierde estudiantes cada semestre. Ordena cómo llevar la conversación de alto impacto:",seq:["Nombrar su dolor: 'Sé lo que cuesta ver aulas vaciándose cada semestre…'","Dar el dato: 'nuestro programa baja la deserción un 22%'","Pintar el alivio: 'imagina el otro año con las aulas llenas'","Cerrar con la ventaja: 'y lo logras conmigo, que…'"],e:"Dolor → Beneficio (dato + emoción) → Ventaja. Se abre con el dolor, no con tu portafolio ni el precio."},
{m:1,t:"vf",d:"basico",q:"Dos personas pueden vivir exactamente el mismo evento y sacar conclusiones opuestas.",o:["Verdadero","Falso"],c:0,e:"Cada una lo procesa con su propio mapa; por eso las conclusiones difieren."},
{m:1,t:"unica",d:"intermedio",caso:true,q:"En una junta el jefe dice 'hay que mejorar los números' y cada gerente entiende algo distinto. ¿Por qué pasa?",o:["Omite datos y cada uno la completa con su mapa","Es una generalización por hablar de 'los números'","Los gerentes no prestaban suficiente atención","El jefe lo dijo en un tono de voz muy bajito"],c:0,e:"Omisión + mapa propio: sin precisar qué números, cómo y cuánto, cada quien rellena distinto."},
{m:1,t:"clasificar",d:"intermedio",q:"Clasifica cada frase interna como que REFUERZA un recurso o REFUERZA un límite:",cats:["Refuerza un recurso","Refuerza un límite"],items:[["Puedo aprender esto con práctica",0],["Soy un desastre para esto",1],["Aún no lo domino, pero avanzo",0],["Nunca se me van a dar los números",1]],e:"El lenguaje interno fabrica la experiencia (doble vía). Elige palabras que abran, no que cierren."},
{m:1,t:"ordenar",d:"basico",q:"Ordena el triángulo semiótico, de lo real a lo simbólico:",seq:["Objeto real (la cosa)","Imagen mental (tu representación)","Palabra (el símbolo)"],e:"La palabra está a dos pasos de la realidad: nombra una imagen de un objeto real."},
{m:1,t:"completar",d:"intermedio",q:"Cambiar 'tengo que' por 'elijo' es un ejemplo de cómo el ______ moldea la experiencia.",o:["lenguaje","cuerpo","azar","tiempo"],c:0,e:"Doble vía: cambiar la palabra cambia cómo lo vives y actúas."},
{m:1,t:"unica",d:"avanzado",caso:true,q:"Un empleado evita presentar en público y justo ese día 'se enferma'. La intención positiva probable es:",o:["Protegerse de un miedo","Fastidiar a su jefe","Descansar por pereza","Ninguna, es casualidad"],c:0,e:"Toda conducta tiene intención positiva: aquí, evitar una amenaza percibida. Se trabaja el miedo, no el síntoma."},
{m:1,t:"asociar",d:"intermedio",q:"Asocia cada presuposición con su frase:",pairs:[["El mapa no es el territorio","Cada quien ve la misma escena distinto"],["Intención positiva","Toda conducta busca algo bueno por debajo"],["Doble vía","El lenguaje que uso moldea mi pensar"]],e:"Tres pilares del Bloque 1, en una frase cada uno."},
{m:1,t:"vf",d:"intermedio",q:"El triángulo semiótico afirma que la palabra ES la cosa que nombra.",o:["Verdadero","Falso"],c:1,e:"Falso: la palabra es solo un símbolo de una imagen mental de la cosa. No es la cosa."},
{m:1,t:"multiple",d:"intermedio",q:"¿Cuáles SÍ son presuposiciones de la PNL? (elige todas)",o:["El mapa no es el territorio","Todo comportamiento tiene intención positiva","La realidad es única e igual para todos","El pasado determina todo sin remedio"],c:[0,1],e:"Las dos primeras son presuposiciones PNL; las otras dos las contradicen."},
{m:1,t:"unica",d:"avanzado",caso:true,q:"Tu hijo llega diciendo 'nadie me quiere en el colegio'. ¿Qué haces primero desde la PNL?",o:["'Claro que sí te quieren, tranquilo'","Llamar al colegio de inmediato","'¿Nadie? ¿ni una sola vez alguien?'","Cambiarlo de colegio cuanto antes"],c:2,e:"'Nadie' es una generalización. Preguntar abre el mapa sin negar su emoción."},
{m:1,t:"unica",d:"basico",q:"El 'cine interno' y el 'blah, blah' son:",o:["Los dos códigos con que pensamos","Dos tipos de personalidad básicos","Los dos hemisferios del cerebro","Dos emociones fundamentales"],c:0,e:"Pensamos en imágenes y en lenguaje; traducir de uno a otro pierde información."},
{m:1,t:"completar",d:"basico",q:"'El mapa no es el ______.'",o:["territorio","camino","destino","futuro"],c:0,e:"Presuposición central: operamos con nuestra representación, no con la realidad directa."},
{m:1,t:"unica",d:"intermedio",q:"Dos testigos de un mismo accidente dan versiones distintas. ¿Por qué?",o:["Uno de los dos miente sin ninguna duda","La memoria graba los hechos sin error","No vieron físicamente la misma escena","Cada uno se hizo un mapa del hecho"],c:3,e:"Percepción + lenguaje generan mapas diferentes de un mismo territorio."},
{m:1,t:"unica",d:"basico",q:"Según la PNL, en el día a día operamos con…",o:["Nuestra representación interna de la realidad","Los hechos objetivos tal como ocurren allá afuera","La realidad captada sin ningún filtro previo","El razonamiento puramente lógico y neutral"],c:0,e:"Siempre hay un mapa entre nosotros y el territorio."},
{m:1,t:"unica",d:"avanzado",caso:true,q:"Un cliente molesto te escribe 'su servicio es pésimo'. Antes de reaccionar, lo más útil es recordar que…",o:["Está exagerando y no vale la pena","Es su mapa; indaga qué pasó","Debes defender tu servicio de inmediato","Dale la razón para calmarlo rápido"],c:1,e:"'Pésimo' es interpretación (mapa). Preguntas qué pasó exactamente para llegar al territorio."},
{m:2,t:"unica",d:"basico",q:"El 5% consciente corresponde a…",o:["La punta del iceberg: lógico y verbal","La mente entera en funcionamiento","Las emociones más profundas y sumergidas","El mundo de los sueños y símbolos"],c:0,e:"Consciente = 5%, la punta. El 95% (inconsciente) está sumergido."},
{m:2,t:"unica",d:"intermedio",caso:true,q:"Repites 'mañana empiezo la dieta' y nunca lo haces. ¿Qué está ganando la partida?",o:["El 95% inconsciente","La falta de información","El clima","La genética únicamente"],c:0,e:"La voluntad (5%) no vence a los patrones inconscientes (95%). Hay que trabajar la creencia o el hábito."},
{m:2,t:"clasificar",d:"intermedio",q:"Clasifica cada actividad según el hemisferio que domina:",cats:["Hemisferio izquierdo","Hemisferio derecho"],items:[["Revisar un balance de cifras",0],["Imaginar tu casa ideal",1],["Seguir una receta paso a paso",0],["Dejarte llevar por la música",1]],e:"Izquierdo: lógico/secuencial. Derecho: imágenes/emoción. (Modelo de comunicación, no anatomía estricta.)"},
{m:2,t:"vf",d:"intermedio",q:"Miller demostró que la mente consciente puede procesar información ilimitada a la vez.",o:["Verdadero","Falso"],c:1,e:"Falso: 7±2 = solo 5 a 9 unidades a la vez. Es un cuello de botella."},
{m:2,t:"unica",d:"avanzado",q:"Un anuncio da primero la ficha técnica y luego muestra una familia feliz usándolo. ¿Qué principio aplica?",o:["Apela solo a la lógica racional del comprador","Del hemisferio izquierdo pasa al derecho","Apela solo a la emoción del comprador","Mezcla las ideas y confunde al cliente"],c:1,e:"Entra por la razón (permiso) y cierra por la emoción (decisión)."},
{m:2,t:"completar",d:"basico",q:"La cadena de Ferguson: creencia → pensamiento → ______ → resultado.",o:["acción","emoción","recuerdo","palabra"],c:0,e:"Creencia → pensamiento → acción → resultado."},
{m:2,t:"multiple",d:"intermedio",q:"Si el 95% de la decisión es inconsciente, ¿qué conviene al comunicar? (elige todas)",o:["Apelar a emociones y motivos profundos","Simplificar el mensaje a pocas ideas","Dar la mayor cantidad de datos posible","Ignorar por completo la lógica"],c:[0,1],e:"Emoción + simplicidad. Ni saturar de datos ni despreciar la lógica (el dato abre la puerta)."},
{m:2,t:"unica",d:"intermedio",q:"¿Por qué un menú de 6 platos suele vender más que uno de 30?",o:["No satura la memoria de trabajo 7±2; decidir es fácil","La calidad de los platos suele ser bastante mayor","Imprimir una carta más corta cuesta bastante menos dinero","La gente no llega a leer las cartas largas por pereza"],c:0,e:"Demasiadas opciones colapsan el consciente y paralizan la decisión."},
{m:2,t:"unica",d:"avanzado",caso:true,q:"En una entrevista, un candidato enumera 15 fortalezas y el reclutador no recuerda ninguna. ¿Qué falló?",o:["Las fortalezas no eran memorables","El reclutador no prestó atención","Saturó su memoria de trabajo, 7±2","Faltó jerarquizar bien las fortalezas"],c:2,e:"Tres fortalezas bien elegidas se recuerdan; quince se pierden."},
{m:2,t:"unica",d:"basico",q:"El inconsciente se describe en clase como…",o:["Lo que actúa sin que me dé cuenta","La parte lógica y racional de la mente","La memoria de trabajo de corto plazo","La voluntad consciente que decide todo"],c:0,e:"Es el 95% sumergido que gobierna gran parte de la conducta."},
{m:2,t:"vf",d:"intermedio",q:"El dato convence por sí solo; la emoción solo estorba en una venta.",o:["Verdadero","Falso"],c:1,e:"Falso: el dato da permiso racional, pero la emoción (derecho/inconsciente) es la que decide."},
{m:2,t:"unica",d:"intermedio",q:"'Entra por la razón, decide la emoción' resume la relación entre…",o:["El pasado y el futuro de la persona","El emisor y receptor del mensaje","Los dos hemisferios del cerebro","El precio y el valor del producto"],c:2,e:"Izquierdo abre; derecho decide. Se aplica en el Bloque 5."},
{m:2,t:"asociar",d:"basico",q:"Asocia cada dato con su concepto:",pairs:[["5%","La mente consciente"],["95%","La mente inconsciente"],["7 ± 2","La memoria de trabajo"],["Harvard, 1956","George Miller"]],e:"Repaso de las cifras clave del bloque (Miller: Harvard, no Chicago)."},
{m:2,t:"unica",d:"intermedio",caso:true,q:"Tras una charla muy técnica, el cliente dice 'déjame pensarlo'. Lo más probable es que…",o:["Le hablaste al 5% consciente; faltó la emoción","No entendió nada porque el tema era muy difícil","El producto en realidad no le sirve para nada","Aún necesita que le des muchos más datos duros"],c:0,e:"Sin emoción, la decisión (que vive en el 95%) no se activa."},
{m:3,t:"unica",d:"intermedio",img:"wilson",q:"Estas preguntas —qué, cómo, cuándo, dónde, cuánto— sirven sobre todo para romper…",o:["La omisión","La generalización","La distorsión","El anclaje"],c:0,e:"Recuperan el dato que la omisión borró."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"Un colaborador dice: 'No entregué porque el sistema estaba lento.' Sospechas una distorsión. ¿Qué preguntas?",o:["'¿Por qué siempre pones excusas?'","'¿Nunca entregaste con él lento?'","'¿Cuándo lo entregas entonces?'","'Tranquilo, esas cosas pasan a veces'"],c:1,e:"Cuestionas el vínculo A→B (sistema lento ⇒ no entrego) con un contraejemplo."},
{m:3,t:"asociar",d:"basico",q:"Asocia cada patrón con su descripción:",pairs:[["Generalización","Un caso se vuelve regla universal"],["Omisión","Falta información / el dato"],["Distorsión","Se inventa una relación causa-efecto"]],e:"Los tres filtros que empobrecen el mapa."},
{m:3,t:"vf",d:"intermedio",q:"'Deberías esforzarte más' contiene una omisión.",o:["Verdadero","Falso"],c:0,e:"Verdadero: falta el referente. Se recupera con Wilson."},
{m:3,t:"unica",d:"intermedio",q:"'Todo el mundo sabe que eso no funciona.' El reto que rompe esa generalización es:",o:["¿Todos? ¿A quién sí le funcionó?","¿Y a ti qué te consta exactamente?","Puede que tengas algo de razón","¿Cuánto cuesta ponerlo en práctica?"],c:0,e:"Buscar el contraejemplo desarma el 'todo el mundo'."},
{m:3,t:"completar",d:"intermedio",q:"La distorsión enlaza A con B como si A ______ B, sin que sea cierto.",o:["causara","nombrara","midiera","repitiera"],c:0,e:"Es una relación causa-efecto inventada."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"En pareja te dicen: 'Si de verdad me quisieras, sabrías lo que necesito.' ¿Qué patrón es y cómo lo abordas?",o:["Generalización; buscas la excepción","Distorsión; preguntas qué necesita","Omisión que no tiene solución posible","Ninguno; en el fondo tiene razón"],c:1,e:"'Deberías saberlo' es lectura de mente (distorsión). Se resuelve recuperando lo omitido: qué necesita."},
{m:3,t:"unica",d:"basico",q:"El propósito de las preguntas del Metamodelo es…",o:["Recuperar datos y dar precisión al mapa del otro","Ganar la discusión con argumentos mucho mejores","Cambiar de tema cuando la charla se pone incómoda","Demostrarle que sabes mucho más que la otra persona"],c:0,e:"Devuelven nitidez a lo que se generalizó, omitió o distorsionó."},
{m:3,t:"clasificar",d:"avanzado",q:"Clasifica estas frases de trabajo según el patrón:",cats:["Generalización","Omisión","Distorsión"],items:[["Aquí nunca reconocen el esfuerzo",0],["Hay que optimizar el proceso",1],["No me saludó, le caigo mal",2],["Esto hay que hacerlo mejor",1]],e:"Nunca = generalización; optimizar/mejor sin referente = omisión; no me saludó ⇒ le caigo mal = distorsión."},
{m:3,t:"unica",d:"intermedio",img:"romper_omision",q:"La fórmula '¿cuántos quiénes hacen qué, para que pase qué, de qué manera?' se usa para…",o:["Generalizar la situación más rápido","Recuperar la información omitida","Anclar una emoción al discurso","Cerrar una venta con precisión"],c:1,e:"Es la fórmula maestra de Wilson contra la omisión."},
{m:3,t:"vf",d:"basico",q:"Aplicar el Metamodelo es sinónimo de llevar la contraria y ganar discusiones.",o:["Verdadero","Falso"],c:1,e:"Falso: se hace con preguntas que ayudan a recuperar información, no para imponerse."},
{m:3,t:"ordenar",d:"intermedio",q:"Ordena los pasos para trabajar una frase con el Metamodelo:",seq:["Escuchar la frase del otro","Detectar el patrón (generalización, omisión o distorsión)","Hacer la pregunta que lo rompe","Recuperar la información y avanzar"],e:"Escuchar → detectar → preguntar → recuperar."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"Un cliente dice: 'Su propuesta es cara.' Antes de bajar el precio, ¿qué preguntas?",o:["¿Cara comparada con qué, exactamente?","¿Es que no le alcanza el presupuesto ahora?","Le puedo hacer un buen descuento","Todos me dicen exactamente lo mismo"],c:0,e:"'Cara' esconde una comparación omitida; recuperas el estándar oculto."},
{m:3,t:"unica",d:"basico",q:"Un truco para recordar los 3 patrones es:",o:["V · A · K","D · O · G","P · N · L","F · A · B"],c:1,e:"D-O-G ayuda a no olvidarlos."},
{m:4,t:"unica",d:"intermedio",img:"detras_no",q:"La creencia 'No debo' se abre con la pregunta:",o:["¿Qué pasaría si lo hiciéramos?","¿Qué es lo que te lo impide?","¿Comparado con quién o con qué?","¿Qué o cuánto sí tienes ahora?"],c:0,e:"'No debo' es un operador de necesidad; se explora con '¿qué pasaría si…?'."},
{m:4,t:"unica",d:"avanzado",caso:true,q:"Alguien dice: 'No tengo tiempo para estudiar.' ¿Cuál es la mejor pregunta?",o:["'¿Por qué no priorizas mejor?'","'¿Cuánto tiempo SÍ tienes al día?'","'¿Cuántas horas sueles dormir?'","'Entonces déjalo para más adelante'"],c:1,e:"'No tengo' se abre mostrando los recursos que sí existen aunque parezcan invisibles."},
{m:4,t:"ordenar",d:"avanzado",caso:true,q:"Un amigo cree 'no sirvo para vender'. Ordena cómo aplicar los 5 pasos:",seq:["Evaluar: ¿qué tan cierto es que 'nunca' sirves?","Identificar el tipo: es una generalización","Preguntar: '¿alguna vez lograste vender algo?'","Responder: sí, aquella vez cerré un trato","¿Cómo puedo repetir y mejorar eso?"],e:"Evaluar → tipificar → preguntar → responder → accionar."},
{m:4,t:"vf",d:"basico",q:"Una creencia se cambia mejor afirmándole a la persona, con fuerza, que está equivocada.",o:["Verdadero","Falso"],c:1,e:"Falso: la afirmación genera resistencia. La pregunta hace que la persona encuentre sola la grieta."},
{m:4,t:"asociar",d:"intermedio",q:"Asocia cada 'No' con lo que revela su pregunta:",pairs:[["No puedo","El obstáculo real"],["No debo","La regla oculta que quizá ya no sirve"],["No tengo","Los recursos que sí existen"],["No sé","El camino o la persona que ayuda"]],e:"Cada pregunta-llave abre algo distinto."},
{m:4,t:"unica",d:"intermedio",q:"¿Por qué conviene empezar por creencias superficiales antes que por las profundas?",o:["Dan avance y confianza antes de la identidad","Son las únicas creencias que de verdad importan","Las creencias profundas en realidad no existen","Solo sirven para hacer perder el tiempo"],c:0,e:"Estrategia escalonada: primero lo fácil, luego el fondo."},
{m:4,t:"completar",d:"basico",q:"El paso 5 del proceso convierte el desarme en ______.",o:["acción","teoría","excusa","duda"],c:0,e:"'¿Cómo puedo lograrlo?' lleva de desarmar la creencia a un camino concreto."},
{m:4,t:"unica",d:"avanzado",caso:true,q:"Tu equipo dice: 'No se puede entregar en dos semanas.' ¿Cómo lo abordas primero?",o:["'Háganlo igual, sin más excusas.'","'¿Qué lo impide y qué lo haría posible?'","'Tienen razón, movamos la fecha ya.'","'¿Por qué se ponen siempre tan negativos?'"],c:1,e:"Reto al 'No se puede' (posibilidad): revelas el obstáculo real y buscas recursos."},
{m:4,t:"unica",d:"basico",q:"Una creencia limitante suele ser…",o:["Una interpretación, no un hecho comprobado","Una verdad absoluta imposible de discutir","Un dato objetivo bien respaldado por la ciencia","Algo fijo que ya no se puede cambiar jamás"],c:0,e:"Por eso se puede reescribir: es mapa, no territorio."},
{m:4,t:"vf",d:"intermedio",q:"'No soy bueno con la tecnología' es una creencia de identidad.",o:["Verdadero","Falso"],c:0,e:"Toca el 'yo soy'. Distinta de 'no sé usar tal programa' (superficial)."},
{m:4,t:"unica",d:"intermedio",q:"'No sé por dónde empezar mi negocio.' ¿Qué pregunta abre esa creencia 'No sé'?",o:["'¿Por qué no lo investigaste antes?'","'¿Quién sí sabe y puede orientarte?'","'¿Cuánto capital tienes para invertir?'","'Es difícil, tal vez mejor no empieces'"],c:1,e:"'No sé' se abre buscando el aprendizaje o la persona que ayuda."},
{m:4,t:"unica",d:"avanzado",caso:true,q:"Cliente: 'Ya intenté todo y nada funciona.' ¿Mejor intervención?",o:["¿Todo? ¿Qué no probaste? ¿Qué sí funcionó?","Entonces quizá lo mejor sea rendirse ya","Seguro que no lo has intentado bien del todo","A mí me pasó exactamente lo mismo antes"],c:0,e:"'Todo/nada' es generalización; la excepción y lo no intentado reabren opciones."},
{m:4,t:"unica",d:"intermedio",q:"En el proceso de 5 pasos, ¿qué se hace justo DESPUÉS de identificar el tipo de creencia?",o:["Repetir la creencia palabra por palabra","Lanzar la pregunta que la desarma","Rendirse y aceptar esa creencia","Cambiar de tema de conversación"],c:1,e:"Evaluar → tipificar → PREGUNTAR (desarmar) → responder → accionar."},
{m:5,t:"unica",d:"intermedio",img:"quien_que_motivo",q:"En el modelo Quién–Qué–Motivo, el 'Objetivo' busca que la otra persona…",o:["Que actúe, sienta o piense algo concreto","Que pague por el producto de forma inmediata","Que se quede en silencio escuchándote","Que repita exactamente tu mismo discurso"],c:0,e:"El objetivo es lograr una acción, emoción o pensamiento concreto."},
{m:5,t:"unica",d:"intermedio",img:"preg_estrategicas",q:"Las tres preguntas estratégicas sirven para…",o:["Cerrar la venta lo más rápido posible","Definir el objetivo, medir y actuar","Bajar el precio ante la objeción","Impresionar al cliente con datos"],c:1,e:"¿Qué quiero? ¿Qué tengo? ¿Qué falta? = enfoque antes de actuar."},
{m:5,t:"ordenar",d:"intermedio",q:"Ordena la secuencia persuasiva y su recorrido cerebral:",seq:["Dolor","Beneficio: dato del hemisferio izquierdo","Beneficio: emoción del hemisferio derecho","Ventaja (por qué tú)"],e:"Abres con dolor, argumentas dato→emoción y cierras con la ventaja diferencial."},
{m:5,t:"asociar",d:"intermedio",q:"Asocia cada nivel con la pregunta que responde:",pairs:[["Característica","¿Qué tiene?"],["Beneficio","¿Para qué me sirve?"],["Ventaja","¿Por qué tú y no otro?"]],e:"La ventaja es la única que solo tú puedes responder."},
{m:5,t:"unica",d:"avanzado",caso:true,q:"Un gerente quiere que su equipo entregue a tiempo. Le habla de reglas y sanciones, pero nada cambia. ¿Qué le falta?",o:["Hablar al motivo real, no solo a la norma","Aplicar todavía más sanciones y más controles","Repetir el reglamento con más énfasis","Bajar la meta de entregas del equipo"],c:0,e:"El motivo (inconsciente) mueve más que la norma. Quién–Qué–Motivo."},
{m:5,t:"vf",d:"basico",q:"En la conversación de alto impacto se abre hablando del producto y de uno mismo.",o:["Verdadero","Falso"],c:1,e:"Falso: se abre nombrando el DOLOR del cliente. Sin dolor reconocido no hay interés."},
{m:5,t:"unica",d:"avanzado",q:"'Navegar entre los dos hemisferios' en una conversación significa:",o:["Hablar únicamente con historias emotivas","Ir y venir entre la lógica y la emoción","Hablar solo con cifras y datos duros","Alternar de un idioma a otro idioma"],c:1,e:"Solo razón enfría; solo emoción suena vacío. La maestría es el péndulo."},
{m:5,t:"unica",d:"intermedio",q:"'Ahorra tiempo en tus reportes' es un(a)…",o:["Beneficio","Ventaja","Característica","Objeción"],c:0,e:"Sirve dicho por cualquiera ⇒ beneficio. La ventaja solo tiene sentido dicha por ti."},
{m:5,t:"multiple",d:"avanzado",q:"¿Cuáles son VENTAJAS (diferenciales)? (elige todas)",o:["El único con soporte local en tu ciudad","Mejora notablemente tu productividad diaria","Quien más experiencia tiene en tu sector","Resulta muy fácil e intuitivo de usar"],c:[0,2],e:"'Conmigo/el único/quien más' = diferencial. 'Mejora productividad' y 'fácil de usar' los diría cualquiera."},
{m:5,t:"unica",d:"intermedio",caso:true,q:"Vendes software a una empresa que pierde horas en reportes manuales. ¿Cómo abres?",o:["'Somos los líderes indiscutibles del mercado'","'Sé lo que cuesta armar reportes a mano'","'Mi software tiene más de 20 funciones'","'Le doy un 30% de descuento ahora'"],c:1,e:"Abres con el dolor reconocido; luego beneficio y ventaja."},
{m:5,t:"unica",d:"avanzado",caso:true,q:"Un cliente objeta: 'Déjame consultarlo con mi socio.' Interpretas que faltó…",o:["Tocar la emoción para que decida el 95%","Aportar todavía más características técnicas","Ofrecer una rebaja en el precio final","Presionar con más fuerza para el cierre"],c:0,e:"La duda suele ser falta de certeza emocional; se atiende el motivo, no más datos."},
{m:5,t:"unica",d:"basico",q:"La gran idea del bloque 5 es que tú…",o:["Vender siempre al precio más bajo posible","Ser quien le quita un peso al cliente","Hablar mucho de tu propio producto","Cerrar rápido metiendo presión al otro"],c:1,e:"No vendes un producto: resuelves un dolor y te vuelves la opción idónea."},
{m:1,t:"unica",d:"basico",caso:true,q:"Dos personas ven la misma película: una la ama, otra la odia. Desde la PNL, ¿por qué?",o:["Cada una la filtró con su propio mapa","La película cambió entre una función y otra","Una de las dos claramente tiene mal gusto","Influyó el clima que hacía ese mismo día"],c:0,e:"Mismo territorio (la película), distintos mapas: cada quien la interpreta desde su experiencia."},
{m:1,t:"vf",d:"basico",q:"Cambiar la palabra con la que describes algo puede cambiar cómo lo vives.",o:["Verdadero","Falso"],c:0,e:"Pensamiento y lenguaje van en doble vía: la etiqueta verbal moldea la experiencia."},
{m:1,t:"unica",d:"intermedio",q:"La 'intención positiva' de una conducta significa que…",o:["Toda conducta es siempre buena y sana","Toda conducta busca un propósito útil","La intención nunca influye en la conducta","Las personas actúan sin ningún motivo"],c:1,e:"Principio teleológico: la conducta persigue un beneficio; conviene atender ese propósito, no solo la conducta."},
{m:1,t:"completar",d:"intermedio",q:"La secuencia que conecta el deseo con el logro es: querer → ______ → poder.",o:["creencias","suerte","dinero","tiempo"],c:0,e:"Las creencias son el puente: si crees que puedes, se habilita el poder hacerlo."},
{m:1,t:"multiple",d:"basico",q:"¿Cuáles son los dos códigos con que pensamos, según la PNL? (elige dos)",o:["Imágenes","Lenguaje","Números","Sensaciones"],c:[0,1],e:"Pensamos en imágenes y en lenguaje; al traducir de uno a otro se pierde información."},
{m:1,t:"unica",d:"avanzado",caso:true,q:"Un colaborador entendió algo distinto de lo que dijiste en la reunión. Desde 'el mapa no es el territorio', ¿qué haces?",o:["Le dices que no sabe escuchar a nadie","Confirmas cómo lo entendió y aclaras","Repites lo mismo pero mucho más fuerte","Das por hecho que ya quedó claro"],c:1,e:"Tu mensaje pasó por su mapa; verificar la interpretación evita malentendidos."},
{m:1,t:"asociar",d:"basico",q:"Asocia cada concepto de PNL con su idea:",pairs:[["Mapa","Mi representación interna de la realidad"],["Territorio","La realidad tal cual, que nunca vemos directa"],["Doble vía","Pensamiento y lenguaje se influyen mutuamente"]],e:"El mapa (mi versión) nunca es el territorio (lo real); y la palabra moldea el pensamiento."},
{m:2,t:"unica",d:"intermedio",caso:true,q:"Tienes 3 segundos para captar a alguien en redes sociales. ¿A qué le hablas primero?",o:["A la emoción; el dato viene después","A la lógica, con todos los datos posibles","Al precio","A la ficha técnica completa"],c:0,e:"La emoción decide; el dato da permiso. Primero engancha, luego argumenta."},
{m:2,t:"vf",d:"intermedio",q:"Dar 20 argumentos sólidos siempre convence más que dar 3 bien elegidos.",o:["Verdadero","Falso"],c:1,e:"Falso: por 7±2, saturar de argumentos colapsa la memoria de trabajo; menos y nítido se recuerda."},
{m:2,t:"vf",d:"basico",q:"El 95% de nuestras decisiones se explica mejor por hábitos y emociones que por pura lógica.",o:["Verdadero","Falso"],c:0,e:"El 95% inconsciente gobierna gran parte de la conducta; la lógica (5%) solo abre la puerta."},
{m:2,t:"ordenar",d:"intermedio",q:"Ordena cómo entra una decisión de compra según el bloque 2:",seq:["El dato abre la puerta (razón / permiso)","La emoción toma la decisión (95%)","Se ejecuta la acción","Se justifica después con lógica"],e:"Entramos por la razón, decidimos por la emoción y luego racionalizamos."},
{m:2,t:"unica",d:"avanzado",caso:true,q:"Presentaste un proyecto lleno de cifras y el comité dijo 'lo evaluaremos'. ¿Qué faltó, según el bloque 2?",o:["Tocar la emoción; hablaste solo al 5% consciente","Presentar todavía muchas más cifras y datos duros","Exponerlo hablando a un ritmo mucho más acelerado","Ofrecerles directamente un precio más bajo"],c:0,e:"Sin emoción, la decisión (que vive en el 95%) no se activa."},
{m:3,t:"unica",d:"intermedio",caso:true,q:"Un cliente dice: 'Su empresa es poco seria.' ¿Qué reto rompe la OMISIÓN?",o:["'¿Siempre le ha parecido así?'","'¿Poco seria en qué exactamente?'","'Usted está exagerando bastante'","'Todos nuestros clientes dicen eso'"],c:1,e:"'Poco seria' esconde el dato: qué ocurrió exactamente. Se recupera preguntando."},
{m:3,t:"unica",d:"avanzado",caso:true,q:"Tu jefe dice: 'Si te importara el proyecto, te quedarías hasta tarde.' ¿Qué patrón y reto?",o:["Distorsión: ¿solo quedándome tarde importa?","Omisión: ¿qué dato concreto te está faltando?","Generalización: ¿siempre ocurre esto?","Ninguno; en realidad lleva toda la razón"],c:0,e:"Equipara 'importar' con 'quedarse tarde' como si fueran lo mismo (equivalencia compleja: si A, entonces B); se cuestiona ese enlace."},
{m:3,t:"completar",d:"basico",q:"El patrón que convierte un caso en regla universal se llama ______.",o:["generalización","omisión","distorsión","anclaje"],c:0,e:"La generalización toma un caso y lo vuelve ley: siempre, nunca, nadie, todos."},
{m:3,t:"unica",d:"intermedio",caso:true,q:"'El equipo no rinde.' Como líder, ¿qué pregunta rompe la OMISIÓN?",o:["'¿No rinde nunca, en ningún caso?'","'¿Quién, en qué tarea y cuánto?'","'¿De quién es la culpa de todo?'","'Están exagerando la situación.'"],c:1,e:"'No rinde' borra el dato; se recupera con las preguntas de precisión (qué, quién, cuánto)."},
{m:4,t:"unica",d:"intermedio",caso:true,q:"Alguien dice: 'No sirvo para hablar en público.' Según el proceso de 5 pasos, ¿qué haces PRIMERO?",o:["Evaluar qué tan cierta o falsa es esa creencia","Convencerlo de inmediato de que él sí sabe hablar","Cambiar el tema hacia algo más cómodo para él","Rendirte porque esa creencia no tiene arreglo"],c:0,e:"Paso 1: evaluar qué tan cierta o falsa es la creencia antes de desarmarla."},
{m:4,t:"unica",d:"intermedio",caso:true,q:"Cliente: 'No creo que esto funcione para mí.' ¿Qué pregunta abre la creencia?",o:["'Le aseguro que funciona muy bien'","'¿Qué haría que SÍ te funcionara?'","'Todos mis clientes lo dicen igual'","'Entonces mejor no lo compre usted'"],c:1,e:"Abrir con una pregunta hace que la persona misma encuentre la posibilidad, sin resistencia."},
{m:4,t:"completar",d:"basico",q:"Conviene empezar por las creencias ______ antes que por las profundas, para generar confianza rápido.",o:["superficiales","imposibles","ajenas","secretas"],c:0,e:"Primero lo fácil (habilidades puntuales), luego el fondo (identidad)."},
{m:4,t:"vf",d:"intermedio",q:"Afirmarle a alguien con fuerza que 'está equivocado' suele ser la mejor forma de cambiar su creencia.",o:["Verdadero","Falso"],c:1,e:"Falso: la afirmación genera resistencia; la pregunta hace que la persona encuentre sola la grieta."},
{m:4,t:"unica",d:"avanzado",caso:true,q:"Un vendedor de tu equipo repite: 'En esta zona no se vende.' ¿Mejor intervención?",o:["¿Nadie ha vendido aquí? ¿Qué hizo quien sí?","Tienes razón, mejor cambiemos pronto de zona","Solo tienes que esforzarte bastante más","¿Por qué eres siempre tan negativo tú?"],c:0,e:"'No se vende' es generalización; el contraejemplo reabre la posibilidad."},
{m:5,t:"unica",d:"intermedio",caso:true,q:"Vendes un CRM y abres con 'tenemos 40 funciones'. ¿Qué error cometes?",o:["Das muy pocos datos del producto","Abres por la función, no por el dolor","Hablas demasiado del propio cliente","Bajas el precio demasiado pronto al vender"],c:1,e:"Sin dolor reconocido no hay interés; primero el dolor, luego beneficio y ventaja."},
{m:5,t:"unica",d:"avanzado",caso:true,q:"Dos empresas ofrecen exactamente lo mismo. ¿Qué inclina la balanza, según el bloque 5?",o:["La ventaja: por qué contigo y no con otro","El folleto de presentación más vistoso y bonito","Quien consiga hablar mucho más rápido","La característica más técnica y avanzada"],c:0,e:"Cuando el beneficio es igual, decide la ventaja: lo que solo tú puedes ofrecer."},
{m:5,t:"multiple",d:"intermedio",q:"En una conversación de alto impacto conviene: (elige todas)",o:["Abrir nombrando el dolor del cliente","Navegar entre dato y emoción","Cerrar con tu ventaja diferencial y el porqué de elegirte","Hablar solo de las características del producto"],c:[0,1,2],e:"Dolor → beneficio (dato + emoción) → ventaja. Quedarse en características no mueve la decisión."},
{m:5,t:"unica",d:"intermedio",caso:true,q:"El cliente objeta el precio. Desde el bloque 5, antes de bajarlo conviene…",o:["Bajar el precio de inmediato","Reconectar con el dolor y el valor","Ofrecer más características técnicas","Presionar para que firme ya mismo"],c:1,e:"El precio se objeta cuando no se ve el valor; se atiende el dolor y el beneficio, no el número."},
{m:5,t:"unica",d:"avanzado",caso:true,q:"Vendes formación a una empresa con alta rotación de personal. ¿Cómo abres?",o:["Sé lo que cuesta perder y reentrenar gente","Mi programa completo incluye doce módulos","Somos los líderes indiscutibles del mercado","Le ofrezco un veinte por ciento de rebaja"],c:0,e:"Abres con el dolor reconocido; después vienen el beneficio y la ventaja."},
{m:5,t:"completar",d:"basico",q:"La ventaja es lo único que solo tú puedes responder: ¿por qué ______ y no otro?",o:["tú","cuándo","cuánto","dónde"],c:0,e:"Característica = qué tiene; beneficio = para qué sirve; ventaja = por qué tú."},
{m:5,t:"asociar",d:"intermedio",q:"Asocia cada apertura con lo que comunica:",pairs:[["'Sé lo que cuesta perder clientes cada mes…'","Dolor"],["'Recuperas hasta 3 horas por semana'","Beneficio"],["'Y lo logras conmigo, el único con soporte local'","Ventaja"]],e:"Dolor abre, beneficio argumenta, ventaja diferencia."},

var S={module:0,diff:"todas",count:10,queue:[],idx:0,answers:[],start:0,practica:true};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function eq(a,b){if(a.length!==b.length)return false;var x=a.slice().sort(),y=b.slice().sort();for(var i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true;}
function el(h){var d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k));localStorage.setItem(k,JSON.stringify(v));}catch(e){window.__mem=window.__mem||{};if(v===undefined)return window.__mem[k];window.__mem[k]=v;}}

function cfg(isP){renderConfig(isP);}

  h+='<div class="lbl">Dificultad</div><div class="chips" id="diffs"></div>';
  h+='<div class="lbl">Número de preguntas</div><div class="chips" id="counts"></div>';
  h+='<button class="start" id="startBtn">Empezar '+(isP?'práctica':'examen')+' <i data-lucide="arrow-right"></i></button>';
  c.innerHTML=h;app.appendChild(c);
  c.querySelector('#cfgback').onclick=renderHome;
  if(isP){var mods=c.querySelector('#mods');
    var rows=[{v:0,num:'<i data-lucide="layers"></i>',nm:'Todos los módulos',color:'var(--midnight)'}];
    for(var k=1;k<=5;k++)rows.push({v:k,num:('0'+k),nm:MODULES[k].name,color:MODULES[k].color});
    rows.forEach(function(o){var on=S.module===o.v;var b=el('<button class="modrow'+(on?' on':'')+'"><span class="mnum" style="background:'+o.color+'">'+o.num+'</span><span class="mnm">'+o.nm+'</span><span class="mck">'+(on?'<i data-lucide="check-circle"></i>':'')+'</span></button>');if(on)b.style.borderColor=(o.v?MODULES[o.v].color:'var(--electric)');b.onclick=function(){S.module=o.v;renderConfig(isP);};mods.appendChild(b);});}
  var diffs=c.querySelector('#diffs');
  [["todas","Todas"],["basico","Básico"],["intermedio","Intermedio"],["avanzado","Avanzado"]].forEach(function(o){var b=el('<button class="chip'+(S.diff===o[0]?' on':'')+'">'+o[1]+'</button>');b.onclick=function(){S.diff=o[0];renderConfig(isP);};diffs.appendChild(b);});
  var counts=c.querySelector('#counts');
